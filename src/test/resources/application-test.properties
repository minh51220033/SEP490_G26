# Profile 'test' mặc định dùng H2 in-memory (MODE=MySQL), tuyệt đối không kế thừa datasource cv_dcms_db từ application.properties
spring.datasource.url=jdbc:h2:mem:cv_dcms_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000;NON_KEYWORDS=MONTH,YEAR
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false
spring.sql.init.mode=never
spring.devtools.restart.enabled=false
