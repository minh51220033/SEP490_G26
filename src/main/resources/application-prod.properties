# ===================================================================
# CV-DCMS PRODUCTION PROFILE (application-prod.properties)
# Target: Oracle Cloud Always Free (Java 17, MySQL 8, Ubuntu ARM64)
# ===================================================================

# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=
server.forward-headers-strategy=native

# Character Encoding & Locale
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true
spring.sql.init.encoding=UTF-8

# MySQL Database Configuration (Mandatory Environment Variables in Production)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cv_dcms_db?createDatabaseIfNotExist=false&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&zeroDateTimeBehavior=convertToNull&useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP) Optimized for 4-core Ampere ARM64
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# JPA & Hibernate Production Protection: NEVER modify schema at runtime
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=true
spring.jpa.defer-datasource-initialization=false

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# SQL Init disabled in production
spring.sql.init.mode=never
spring.sql.init.continue-on-error=false

# Thymeleaf Production Caching
spring.thymeleaf.cache=true

# Error Handling & Security Masking (Never leak stacktraces or internal details to clients)
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# SMTP Mail Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# File Upload Size Limits
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=25MB

# Production Storage Directories (Configurable to persistent block volume)
app.upload-dir=${UPLOAD_DIR:/var/cvdcms/uploads}
app.upload.dir=${UPLOAD_DIR:/var/cvdcms/uploads}
app.emr.private-dir=${EMR_PRIVATE_DIR:/var/cvdcms/private-uploads/emr}
app.patient-document-dir=${PATIENT_DOC_DIR:/var/cvdcms/private-uploads/patient-documents}

# Static Resources (Strictly classpath only; file uploads handled via secured controllers or Nginx)
spring.web.resources.static-locations=classpath:/static/

# NanoPix Integration Secret
nanopix.agent.api-key=${NANOPIX_API_KEY}

# WebSocket Settings
app.websocket.allowed-origins=${WS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080,https://localhost:8080,https://127.0.0.1:8080}

# Gemini AI Secret
gemini.api.key=${GEMINI_API_KEY}
gemini.api.model=gemini-2.5-flash
