# Server Port
server.port=8080

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/cv_dcms_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&zeroDateTimeBehavior=convertToNull&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Character Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true
spring.sql.init.encoding=UTF-8

# JPA / Hibernate Performance Optimization
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=true

# Data Initialization Configuration
spring.sql.init.mode=never
spring.sql.init.continue-on-error=true
spring.jpa.defer-datasource-initialization=true

# Thymeleaf Cache (disabled for local development)
spring.thymeleaf.cache=false

# Mail Configuration (Supports environment variables with local development fallbacks)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:minhnro72@gmail.com}
spring.mail.password=${MAIL_PASSWORD:otsgayzmrfembpja}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# File Upload Settings
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=25MB

# Storage Directories
app.upload-dir=${UPLOAD_DIR:uploads}
app.upload.dir=${UPLOAD_DIR:uploads}
app.emr.private-dir=${EMR_PRIVATE_DIR:private-uploads/emr}
app.patient-document-dir=${PATIENT_DOC_DIR:private-uploads/patient-documents}

# Static Resources (Strictly classpath static; external uploads protected and served via controller/handler)
spring.web.resources.static-locations=classpath:/static/

# NanoPix Integration Secret
nanopix.agent.api-key=${NANOPIX_API_KEY:cvdcms-nanopix-secret-key-change-me}

# Gemini AI Configuration
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY}
gemini.api.model=gemini-2.5-flash

# WebSocket Settings
app.websocket.allowed-origins=${WS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080,https://localhost:8080,https://127.0.0.1:8080}

# Disable Flyway for local development (database is managed by Hibernate update)
spring.flyway.enabled=false

# Ngăn Spring Boot tự bật HTTP Basic Auth mặc định và cấu hình DevTools chờ biên dịch xong mới restart
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
spring.devtools.restart.poll-interval=3000ms
spring.devtools.restart.quiet-period=2000ms
