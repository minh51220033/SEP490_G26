# Server Port
server.port=8080

# MySQL Configuration (Thêm zeroDateTimeBehavior=convertToNull để chặn lỗi ngày tháng số 0)
spring.datasource.url=jdbc:mysql://localhost:3306/cv_dcms_1?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&zeroDateTimeBehavior=convertToNull
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf Cache Disabled
spring.thymeleaf.cache=false

