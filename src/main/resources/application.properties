# Server Port
server.port=8080

# MySQL Configuration (Thêm zeroDateTimeBehavior=convertToNull để chặn lỗi ngày tháng số 0)
spring.datasource.url=jdbc:mysql://localhost:3306/cv_dcms_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&zeroDateTimeBehavior=convertToNull&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=class9stop
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Character Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true
spring.sql.init.encoding=UTF-8

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf Cache Disabled
spring.thymeleaf.cache=false

# Mail configuration
spring.mail.host=smtp.gmail.com
spring.mail.username=jong060600110@gmail.com
spring.mail.password=bgjxuasvyvquaidt
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.jpa.defer-datasource-initialization=true

# Khởi chạy file data.sql sau khi Hibernate tạo bảng xong
# Chỉ định thời điểm khởi tạo script (always, embedded, never)
spring.sql.init.mode=always

# Thiết lập hành vi khi gặp lỗi script (fail hoặc continue)
spring.sql.init.continue-on-error=true


# File Upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Ép Spring Boot nhận diện thư mục static và tài nguyên bên ngoài rõ ràng
spring.web.resources.static-locations=classpath:/static/,file:uploads/

# Gemini AI Configuration for Dental Treatment Plans
