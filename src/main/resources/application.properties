# Server Port
server.port=8080

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/cv_dcms_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&zeroDateTimeBehavior=convertToNull&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Character Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true
spring.sql.init.encoding=UTF-8

# JPA / Hibernate Performance Optimization
# 1. Đổi sang validate để ngăn Hibernate chạy hàng chục lệnh ALTER TABLE khi khởi động
spring.jpa.hibernate.ddl-auto=validate

# 2. Tắt log SQL ra Console để tiết kiệm tài nguyên I/O và RAM (khi cần debug có thể bật lại true)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# 3. Tắt Open-In-View để tránh giữ kết nối DB quá lâu trong quá trình render giao diện
spring.jpa.open-in-view=false

# Data Initialization Configuration
# 4. Tắt chế độ luôn luôn nạp data.sql mỗi lần khởi động (đổi sang 'never' vì DB local của bạn đã có đủ dữ liệu)
spring.sql.init.mode=never
spring.sql.init.continue-on-error=true
spring.jpa.defer-datasource-initialization=true

# Thymeleaf Cache Disabled (cho phép sửa HTML/CSS mà không cần khởi động lại)
spring.thymeleaf.cache=false

