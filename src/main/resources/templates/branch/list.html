<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Quản lý cơ sở')}"></head>

<body class="app-body">

<div class="app-shell">

    <aside th:replace="~{fragments/sidebar :: sidebar('branches')}"></aside>
    <div th:replace="~{fragments/sidebar :: sidebarBackdrop}"></div>

    <div class="app-main">

        <header th:replace="~{fragments/header :: appTopbar('Quản lý cơ sở')}"></header>

        <main class="app-content">
            <link rel="stylesheet" th:href="@{/css/branch.css}">

            <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
            <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

            <!-- DANH SÁCH CHI NHÁNH (SCR-40.1) -->
            <section class="panel">
                <div class="panel__head">
                    <div>
                        <h3 class="panel__title">Danh sách chi nhánh</h3>
                        <p class="panel__subtitle">Quản lý cơ sở, phòng khám và ghế nha khoa</p>
                    </div>
                    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createBranchModal">
                        <i class="bi bi-plus-lg" aria-hidden="true"></i> Thêm chi nhánh
                    </button>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0 branch-table">
                        <thead class="table-light">
                        <tr>
                            <th>Mã</th>
                            <th>Tên chi nhánh</th>
                            <th>Địa chỉ</th>
                            <th>Liên hệ</th>
                            <th>Phòng / Ghế</th>
                            <th>Trạng thái</th>
                            <th class="text-center">Thao tác</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="branch : ${branches}">
                            <td><strong th:text="${branch.branchCode}">CN01</strong></td>
                            <td th:text="${branch.branchName}">Chi nhánh</td>
                            <td th:text="${branch.address}">Địa chỉ</td>
                            <td>
                                <div th:text="${branch.phone != null ? branch.phone : '-'}">-</div>
                                <small class="text-muted" th:text="${branch.email}"></small>
                            </td>
                            <td>
                                <span class="mini-stat"><i class="bi bi-door-open" aria-hidden="true"></i>
                                    <span th:text="${roomCounts[branch.branchId]}">0</span> phòng</span>
                                <span class="mini-stat"><i class="bi bi-heart-pulse" aria-hidden="true"></i>
                                    <span th:text="${chairCounts[branch.branchId]}">0</span> ghế</span>
                            </td>
                            <td>
                                <span th:if="${branch.isActive}" class="badge bg-success">Đang hoạt động</span>
                                <span th:unless="${branch.isActive}" class="badge bg-secondary">Ngừng hoạt động</span>
                            </td>
                            <td class="text-center text-nowrap">
                                <a th:href="@{/admin/branches/{id}(id=${branch.branchId})}"
                                   class="btn btn-sm btn-outline-primary">
                                    <i class="bi bi-diagram-3" aria-hidden="true"></i> Phòng &amp; ghế
                                </a>

                                <form th:if="${branch.isActive}"
                                      th:action="@{/admin/branches/{id}/deactivate(id=${branch.branchId})}"
                                      method="post" class="d-inline">
                                    <button type="submit" class="btn btn-sm btn-outline-danger"
                                            onclick="return confirm('Bạn có chắc muốn ngừng hoạt động chi nhánh này?')">
                                        Ngừng
                                    </button>
                                </form>
                                <form th:unless="${branch.isActive}"
                                      th:action="@{/admin/branches/{id}/activate(id=${branch.branchId})}"
                                      method="post" class="d-inline">
                                    <button type="submit" class="btn btn-sm btn-outline-success">Kích hoạt</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(branches)}">
                            <td colspan="7" class="text-center py-4 text-muted">Chưa có chi nhánh nào.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>

        <footer th:replace="~{fragments/footer :: siteFooter}"></footer>
    </div>
</div>

<!-- MODAL: THÊM CHI NHÁNH -->
<div class="modal fade" id="createBranchModal" tabindex="-1" aria-labelledby="createBranchTitle" aria-hidden="true">
    <div class="modal-dialog">
        <form class="modal-content" th:action="@{/admin/branches}" th:object="${branchForm}" method="post">
            <div class="modal-header">
                <h5 class="modal-title" id="createBranchTitle">Thêm chi nhánh mới</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label for="branchCode" class="form-label">Mã chi nhánh</label>
                    <input type="text" id="branchCode" th:field="*{branchCode}" class="form-control text-uppercase"
                           maxlength="30" pattern="^[A-Za-z0-9_\-]{2,30}$"
                           title="Mã chỉ gồm chữ cái, số, dấu gạch ngang/dưới (2-30 ký tự)" required>
                </div>
                <div class="mb-3">
                    <label for="branchName" class="form-label">Tên chi nhánh</label>
                    <input type="text" id="branchName" th:field="*{branchName}" class="form-control"
                           maxlength="150" required>
                </div>
                <div class="mb-3">
                    <label for="address" class="form-label">Địa chỉ</label>
                    <input type="text" id="address" th:field="*{address}" class="form-control"
                           maxlength="255" required>
                </div>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="phone" class="form-label">Số điện thoại</label>
                        <input type="tel" id="phone" th:field="*{phone}" class="form-control"
                               pattern="^(\+84|0)[0-9]{9,10}$"
                               title="SĐT gồm 10-11 số (ví dụ: 0901234567)" maxlength="20">
                    </div>
                    <div class="col-md-6">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" id="email" th:field="*{email}" class="form-control" maxlength="100">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-light" data-bs-dismiss="modal">Hủy</button>
                <button type="submit" class="btn btn-primary">Thêm chi nhánh</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
