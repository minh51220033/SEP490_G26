<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Thẻ ghế nha dùng trong branch/detail.html (cần biến model: branch, chairStatuses). -->
<div th:fragment="chairCard(chair)" class="chair-card"
     th:classappend="'chair-card--' + ${#strings.toLowerCase(chair.status.name())}">
    <div class="d-flex justify-content-between align-items-start">
        <div>
            <div class="chair-card__code" th:text="${chair.chairCode}">G01</div>
            <div class="chair-card__name" th:text="${chair.chairName}">Ghế 1</div>
        </div>
        <span class="chair-badge" th:classappend="'chair-badge--' + ${#strings.toLowerCase(chair.status.name())}"
              th:text="${chair.status.name() == 'AVAILABLE' ? 'Trống'
                      : chair.status.name() == 'IN_USE' ? 'Đang khám'
                      : chair.status.name() == 'CLEANING' ? 'Vệ sinh'
                      : 'Bảo trì'}">Trống</span>
    </div>

    <form th:action="@{/admin/branches/{id}/chairs/{cid}/status(id=${branch.branchId},cid=${chair.chairId})}"
          method="post" class="mt-2">
        <select name="status" class="form-select form-select-sm" onchange="this.form.submit()"
                aria-label="Đổi trạng thái ghế">
            <option th:each="s : ${chairStatuses}" th:value="${s}" th:text="${s}"
                    th:selected="${s == chair.status}"></option>
        </select>
    </form>

    <div class="chair-card__actions">
        <button type="button" class="btn btn-sm btn-outline-secondary"
                data-bs-toggle="modal" data-bs-target="#chairModal" data-mode="edit"
                th:attr="data-chair-id=${chair.chairId},data-chair-code=${chair.chairCode},data-chair-name=${chair.chairName},data-chair-status=${chair.status},data-room-id=${chair.room != null ? chair.room.roomId : ''}">
            <i class="bi bi-pencil" aria-hidden="true"></i> Sửa
        </button>
        <form th:action="@{/admin/branches/{id}/chairs/{cid}/delete(id=${branch.branchId},cid=${chair.chairId})}"
              method="post" class="d-inline" onsubmit="return confirm('Xóa ghế nha này?');">
            <button type="submit" class="btn btn-sm btn-outline-danger">
                <i class="bi bi-trash" aria-hidden="true"></i>
            </button>
        </form>
    </div>
</div>

</body>
</html>
