<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
    THANH ĐIỀU HƯỚNG TÀI CHÍNH (Đồng bộ qua fragments/finance-tabs)
    Nhóm: Khách hàng (customer)
-->
<div th:fragment="cashierTabs(activeTab)">
    <div th:replace="~{fragments/finance-tabs :: financeTabs('customer', ${activeTab})}"></div>
</div>

<!-- Dropdown chọn nhanh khoảng thời gian đặt cạnh bộ lọc ngày dùng chung cho Thu ngân -->
<select th:fragment="quickDateSelect(fromInputId, toInputId)"
        class="fin-select fin-quick-date-select is-placeholder"
        th:attr="data-quick-date-from=${fromInputId}, data-quick-date-to=${toInputId}"
        onchange="window.handleFinanceQuickDateChange && window.handleFinanceQuickDateChange(this)"
        title="Chọn nhanh khoảng thời gian">
    <option value="">Chọn nhanh</option>
    <option value="today">Hôm nay</option>
    <option value="yesterday">Hôm qua</option>
    <option value="week">7 ngày qua</option>
    <option value="month">Tháng này</option>
    <option value="clear">Xóa ngày</option>
</select>

</body>
</html>
