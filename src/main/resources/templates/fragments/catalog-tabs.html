<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
    THANH TAB NGANG CHO QUẢN LÝ DANH MỤC (CV-DCMS CATALOG TABS)
    activeTab: 'services' | 'categories' | 'medications' | 'icd10'
-->
<nav th:fragment="catalogTabs(activeTab)" class="catalog-tabs-container" aria-label="Quản lý danh mục">
    <div class="catalog-tabs-nav">

        <!-- 1. Danh mục dịch vụ -->
        <a th:href="@{/admin/services}"
           class="catalog-tab-item"
           th:classappend="${activeTab == 'services'} ? 'is-active' : ''"
           th:if="${isAdmin or (permissionCodes != null and (#lists.contains(permissionCodes, 'CATALOG_SERVICES') or #lists.contains(permissionCodes, 'CATALOG_MANAGE')))}"
           id="tab-catalog-services">
            <i class="bi bi-tags" aria-hidden="true"></i>
            <span>Danh mục dịch vụ</span>
        </a>

        <!-- 2. Nhóm dịch vụ -->
        <a th:href="@{/admin/services/categories}"
           class="catalog-tab-item"
           th:classappend="${activeTab == 'categories'} ? 'is-active' : ''"
           th:if="${isAdmin or (permissionCodes != null and (#lists.contains(permissionCodes, 'CATALOG_SERVICES') or #lists.contains(permissionCodes, 'CATALOG_MANAGE')))}"
           id="tab-catalog-categories">
            <i class="bi bi-grid-3x3-gap" aria-hidden="true"></i>
            <span>Nhóm dịch vụ</span>
        </a>

        <!-- 3. Danh mục thuốc -->
        <a th:href="@{/admin/medications}"
           class="catalog-tab-item"
           th:classappend="${activeTab == 'medications'} ? 'is-active' : ''"
           th:if="${isAdmin or (permissionCodes != null and (#lists.contains(permissionCodes, 'CATALOG_MEDICATIONS') or #lists.contains(permissionCodes, 'CATALOG_MANAGE')))}"
           id="tab-catalog-medications">
            <i class="bi bi-capsule" aria-hidden="true"></i>
            <span>Danh mục thuốc</span>
        </a>

        <!-- 4. Danh mục ICD-10 -->
        <a th:href="@{/admin/icd10}"
           class="catalog-tab-item"
           th:classappend="${activeTab == 'icd10'} ? 'is-active' : ''"
           th:if="${isAdmin or (permissionCodes != null and (#lists.contains(permissionCodes, 'CATALOG_ICD10') or #lists.contains(permissionCodes, 'CATALOG_MANAGE')))}"
           id="tab-catalog-icd10">
            <i class="bi bi-clipboard2-pulse" aria-hidden="true"></i>
            <span>Danh mục ICD-10</span>
        </a>

    </div>
</nav>

</body>
</html>
