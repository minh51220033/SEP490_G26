<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">


<!--
    HEAD dùng chung cho toàn bộ trang.
    Cách dùng:
        <head th:replace="~{fragments/head :: head('Trang chủ')}"></head>
-->
<head th:fragment="head(title)">
    <!-- Meta chuẩn mobile: cho phép zoom (accessibility), hỗ trợ tai thỏ (viewport-fit) -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0052cc">
    <meta name="color-scheme" content="light">
    <meta name="format-detection" content="telephone=no">
    <title th:text="${title} + ' | CV-DCMS'">CV-DCMS</title>

    <!--
        Áp dụng trạng thái sidebar TRƯỚC khi trang được vẽ để tránh nháy giao diện (FOUC).
        - is-preload: tắt mọi transition trong lần render đầu, layout.js sẽ gỡ bỏ sau đó.
        - is-sidebar-collapsed: khôi phục trạng thái thu gọn trên desktop đã lưu.
    -->
    <script>
        (function () {
            var root = document.documentElement;
            root.classList.add("is-preload");
            try {
                var collapsed = localStorage.getItem("cvdcms.sidebar.collapsed") === "1";
                if (collapsed && window.matchMedia("(min-width: 992px)").matches) {
                    root.classList.add("is-sidebar-collapsed");
                }
            } catch (e) { /* localStorage bị chặn: dùng mặc định */ }
        })();
    </script>

    <!-- Font Inter: hỗ trợ đầy đủ tiếng Việt, dễ đọc trên màn hình nhỏ -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap&subset=vietnamese"
          rel="stylesheet">

    <!-- Bootstrap (grid, form, utilities cho các trang con) + Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Layout dùng chung (phải nạp SAU Bootstrap để ghi đè) -->
    <link href="../../static/css/layout.css" th:href="@{/css/layout.css}" rel="stylesheet">
    <link th:href="@{/css/service-catalog.css}" rel="stylesheet">
    <link href="../../static/css/chat.css" th:href="@{/css/chat.css}" rel="stylesheet">
