<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- MODAL ĐỔI MẬT KHẨU DÙNG CHUNG -->
<div th:fragment="changePasswordModal">
    <div class="modal fade" id="changePasswordModal" tabindex="-1" aria-labelledby="changePasswordModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow-lg border-0" style="border-radius: 14px; overflow: hidden;">
                <div class="modal-header bg-light border-bottom py-3 px-4">
                    <div class="d-flex align-items-center gap-2">
                        <div class="rounded-circle bg-primary bg-opacity-10 text-primary d-inline-flex align-items-center justify-content-center" style="width:36px; height:36px;">
                            <i class="bi bi-shield-lock-fill fs-5"></i>
                        </div>
                        <div>
                            <h5 class="modal-title fw-bold text-dark mb-0" id="changePasswordModalLabel">Đổi mật khẩu tài khoản</h5>
                            <span class="small text-muted" style="font-size: 12px;">Bảo vệ tài khoản và làm mới phiên xác thực</span>
                        </div>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
                </div>
                <form th:action="@{/profile/change-password}" method="post" id="modalChangePasswordForm">
                    <div class="modal-body px-4 py-3">

                        <!-- Thông báo lỗi khi đổi mật khẩu nếu có -->
                        <div th:if="${passwordError != null}" class="alert alert-danger d-flex align-items-center gap-2 py-2 px-3 mb-3 small shadow-sm" role="alert" style="border-radius:8px;">
                            <i class="bi bi-exclamation-triangle-fill flex-shrink-0 fs-6"></i>
                            <span th:text="${passwordError}">Lỗi đổi mật khẩu.</span>
                        </div>

                        <!-- Mật khẩu hiện tại -->
                        <div class="mb-3">
                            <label for="modalCurrentPassword" class="form-label fw-semibold text-secondary small mb-1">
                                <i class="bi bi-key me-1"></i>Mật khẩu hiện tại <span class="text-danger">*</span>
                            </label>
                            <div class="input-group">
                                <input type="password" class="form-control" id="modalCurrentPassword" name="currentPassword"
                                       placeholder="Nhập mật khẩu đang sử dụng" required autocomplete="current-password">
                                <button class="btn btn-outline-secondary" type="button" onclick="modalTogglePass('modalCurrentPassword', this)" title="Hiện/ẩn mật khẩu">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Mật khẩu mới -->
                        <div class="mb-3">
                            <label for="modalNewPassword" class="form-label fw-semibold text-secondary small mb-1">
                                <i class="bi bi-lock me-1"></i>Mật khẩu mới <span class="text-danger">*</span>
                            </label>
                            <div class="input-group">
                                <input type="password" class="form-control" id="modalNewPassword" name="newPassword"
                                       placeholder="Tối thiểu 8 ký tự" required autocomplete="new-password"
                                       oninput="modalCheckStrength()">
                                <button class="btn btn-outline-secondary" type="button" onclick="modalTogglePass('modalNewPassword', this)" title="Hiện/ẩn mật khẩu">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                            <!-- Thanh đo độ mạnh mật khẩu -->
                            <div class="progress mt-2" style="height: 4px;">
                                <div id="modalStrengthBar" class="progress-bar bg-danger" role="progressbar" style="width: 0%"></div>
                            </div>
                            <div id="modalStrengthText" class="small text-muted mt-1" style="font-size: 11px;">Mật khẩu cần ít nhất 8 ký tự.</div>
                        </div>

                        <!-- Xác nhận mật khẩu mới -->
                        <div class="mb-3">
                            <label for="modalConfirmPassword" class="form-label fw-semibold text-secondary small mb-1">
                                <i class="bi bi-check2-circle me-1"></i>Xác nhận mật khẩu mới <span class="text-danger">*</span>
                            </label>
                            <div class="input-group">
                                <input type="password" class="form-control" id="modalConfirmPassword" name="confirmPassword"
                                       placeholder="Nhập lại chính xác mật khẩu mới" required autocomplete="new-password"
                                       oninput="modalCheckMatch()">
                                <button class="btn btn-outline-secondary" type="button" onclick="modalTogglePass('modalConfirmPassword', this)" title="Hiện/ẩn mật khẩu">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                            <div id="modalMatchFeedback" class="small mt-1" style="font-size: 11px; display: none;"></div>
                        </div>

                        <div class="p-2 rounded bg-light border text-muted small" style="font-size: 11.5px;">
                            <i class="bi bi-info-circle text-primary me-1"></i> Sau khi đổi mật khẩu thành công, hệ thống sẽ tự động thu hồi phiên đăng nhập cũ và duy trì phiên an toàn mới trên thiết bị này.
                        </div>
                    </div>
                    <div class="modal-footer bg-light px-4 py-2 border-top">
                        <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Hủy bỏ</button>
                        <button type="submit" class="btn btn-sm btn-primary px-3 fw-semibold">
                            <i class="bi bi-check-lg me-1"></i>Cập nhật mật khẩu
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Script điều khiển Modal đổi mật khẩu -->
    <script th:inline="javascript">
        function modalTogglePass(inputId, btn) {
            var input = document.getElementById(inputId);
            if (!input) return;
            var icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                if (icon) icon.className = 'bi bi-eye-slash';
            } else {
                input.type = 'password';
                if (icon) icon.className = 'bi bi-eye';
            }
        }

        function modalCheckStrength() {
            var pass = document.getElementById('modalNewPassword').value;
            var bar = document.getElementById('modalStrengthBar');
            var text = document.getElementById('modalStrengthText');
            if (!bar || !text) return;
            var score = 0;
            if (pass.length >= 8) score++;
            if (/[A-Z]/.test(pass)) score++;
            if (/[0-9]/.test(pass)) score++;
            if (/[^A-Za-z0-9]/.test(pass)) score++;

            if (pass.length === 0) {
                bar.style.width = '0%';
                text.innerText = 'Mật khẩu cần ít nhất 8 ký tự.';
                text.className = 'small text-muted mt-1';
            } else if (score <= 1) {
                bar.style.width = '25%';
                bar.className = 'progress-bar bg-danger';
                text.innerText = 'Độ mạnh: Yếu (nên thêm số, chữ in hoa, ký tự đặc biệt)';
                text.className = 'small text-danger mt-1';
            } else if (score === 2) {
                bar.style.width = '50%';
                bar.className = 'progress-bar bg-warning';
                text.innerText = 'Độ mạnh: Trung bình';
                text.className = 'small text-warning mt-1';
            } else if (score === 3) {
                bar.style.width = '75%';
                bar.className = 'progress-bar bg-info';
                text.innerText = 'Độ mạnh: Khá';
                text.className = 'small text-info mt-1';
            } else {
                bar.style.width = '100%';
                bar.className = 'progress-bar bg-success';
                text.innerText = 'Độ mạnh: Rất mạnh (An toàn cao)';
                text.className = 'small text-success mt-1';
            }
            modalCheckMatch();
        }

        function modalCheckMatch() {
            var p1 = document.getElementById('modalNewPassword').value;
            var p2 = document.getElementById('modalConfirmPassword').value;
            var fb = document.getElementById('modalMatchFeedback');
            if (!fb) return;
            if (!p2) {
                fb.style.display = 'none';
                return;
            }
            fb.style.display = 'block';
            if (p1 === p2) {
                fb.innerText = '✓ Mật khẩu xác nhận trùng khớp';
                fb.className = 'small text-success mt-1';
            } else {
                fb.innerText = '✗ Mật khẩu xác nhận chưa khớp';
                fb.className = 'small text-danger mt-1';
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            var params = new URLSearchParams(window.location.search);
            var shouldOpen = params.get('openPasswordModal') === 'true' || /*[[${passwordError != null}]]*/ false;
            if (shouldOpen) {
                var modalEl = document.getElementById('changePasswordModal');
                if (modalEl && typeof bootstrap !== 'undefined') {
                    new bootstrap.Modal(modalEl).show();
                }
            }
        });
    </script>
</div>

</body>
</html>
