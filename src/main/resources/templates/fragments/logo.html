<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
    LOGO thương hiệu.
    Cách dùng:
        <a th:replace="~{fragments/logo :: logo('dark')}"></a>    chữ xanh - dùng trên nền sáng (header công khai)
        <a th:replace="~{fragments/logo :: logo('light')}"></a>   chữ trắng - dùng trên nền xanh (sidebar head, topbar mobile)

    Chế độ thu gọn: khi sidebar ở dạng icon (desktop collapsed), CSS tự ẩn .brand__text
    và chỉ giữ lại .brand__mark - không cần fragment riêng.
-->
<a th:fragment="logo(theme)"
   th:href="@{/home}"
   href="#"
   class="brand"
   th:classappend="${theme == 'light'} ? 'brand--light' : ''"
   aria-label="CV-DCMS - Trang chủ">

    <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
             stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 3c-2.5 0-4 2-4 4.5 0 2 .7 3.5 1.3 5 .6 1.6.8 3.4 1.2 5.2.3 1.4.9 3.3 2 3.3 1.3 0 1.5-2 1.8-3.6.3-1.4.8-2.9 2.7-2.9s2.4 1.5 2.7 2.9c.3 1.6.5 3.6 1.8 3.6 1.1 0 1.7-1.9 2-3.3.4-1.8.6-3.6 1.2-5.2.6-1.5 1.3-3 1.3-5C21 5 19.5 3 17 3c-2 0-3 1-5 1S9 3 7 3z"/>
        </svg>
    </span>

    <span class="brand__text">
        <span class="brand__name">CV-DCMS</span>
        <span class="brand__tagline">Cường Việt Dental</span>
    </span>
</a>

</body>
</html>
