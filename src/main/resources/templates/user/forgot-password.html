<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quên mật khẩu</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 380px;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        .description {
            text-align: center;
            color: #666;
            font-size: 14px;
            line-height: 1.5;
        }

        .form-group {
            margin-top: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #555;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 10px;
            border: none;
            border-radius: 4px;
            background-color: #ffc107;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        button:hover {
            background-color: #e0a800;
        }

        .alert-error {
            background-color: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 4px;
            margin-top: 15px;
            text-align: center;
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }

        .links a {
            color: #007bff;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Quên Mật Khẩu</h2>

    <p class="description">
        Nhập tên đăng nhập của tài khoản cần khôi phục.
        Hệ thống sẽ gửi mã OTP đến email đã đăng ký của tài khoản.
    </p>

    <div th:if="${error}"
         class="alert-error"
         th:text="${error}">
    </div>

    <form th:action="@{/forgot-password}"
          method="POST">

        <div class="form-group">

            <label for="username">
                Tên đăng nhập
            </label>

            <input type="text"
                   id="username"
                   name="username"
                   maxlength="50"
                   required
                   autocomplete="username"
                   placeholder="Nhập tên đăng nhập...">

        </div>

        <button type="submit">
            Gửi mã OTP
        </button>

    </form>

    <div class="links">
        <a href="/login">Quay lại đăng nhập</a>
    </div>

</div>

</body>
</html>
