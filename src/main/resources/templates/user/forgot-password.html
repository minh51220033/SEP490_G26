<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/auth :: head('Quên mật khẩu')}"></head>
<body>

<div class="auth">
    <aside th:replace="~{fragments/auth :: hero}"></aside>

    <main class="auth-main">
        <div class="auth-main__mobile-brand">
            <a th:replace="~{fragments/logo :: logo('dark')}"></a>
        </div>

        <section class="auth-card" aria-labelledby="forgot-title">
            <div class="auth-card__icon" aria-hidden="true"><i class="bi bi-shield-lock"></i></div>
            <h2 id="forgot-title" class="auth-card__title">Quên mật khẩu</h2>
            <p class="auth-card__subtitle">
                Nhập tên đăng nhập của tài khoản cần khôi phục. Hệ thống sẽ gửi mã OTP gồm 6 chữ số đến email đã đăng ký của bạn.
            </p>

            <div class="auth-alerts" role="status">
                <div th:if="${error}" class="auth-alert auth-alert--error">
                    <i class="bi bi-exclamation-circle" aria-hidden="true"></i>
                    <span th:text="${error}">Thông báo lỗi</span>
                </div>
                <div th:if="${success}" class="auth-alert auth-alert--success">
                    <i class="bi bi-check-circle" aria-hidden="true"></i>
                    <span th:text="${success}">Thông báo thành công</span>
                </div>
            </div>

            <form class="auth-form" th:action="@{/forgot-password}" method="POST">
                <div class="field">
                    <div class="field__head">
                        <label class="field__label" for="username">Tên đăng nhập <span class="req">*</span></label>
                    </div>
                    <div class="field__control">
                        <input class="field__input" type="text" id="username" name="username"
                               maxlength="50" required autocomplete="username"
                               placeholder="Nhập tên đăng nhập của bạn">
                        <i class="bi bi-person field__icon" aria-hidden="true"></i>
                    </div>
                </div>

                <button type="submit" class="auth-btn">Gửi mã OTP</button>

                <div class="auth-alert auth-alert--info">
                    <i class="bi bi-info-circle" aria-hidden="true"></i>
                    <span>Mã OTP sẽ có hiệu lực trong vòng 5 phút sau khi hệ thống gửi đi.</span>
                </div>
            </form>

            <div class="auth-center">
                <a class="auth-back" th:href="@{/login}" href="/login">
                    <i class="bi bi-arrow-left" aria-hidden="true"></i> Quay lại đăng nhập
                </a>
            </div>
        </section>
    </main>
</div>

</body>
</html>
