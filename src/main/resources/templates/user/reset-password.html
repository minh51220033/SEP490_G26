<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/auth :: head('Đặt lại mật khẩu')}"></head>
<body>

<div class="auth">
    <aside th:replace="~{fragments/auth :: hero}"></aside>

    <main class="auth-main">
        <div class="auth-main__mobile-brand">
            <a th:replace="~{fragments/logo :: logo('dark')}"></a>
        </div>

        <section class="auth-card" aria-labelledby="reset-title">
            <div class="auth-card__icon" aria-hidden="true"><i class="bi bi-key"></i></div>
            <h2 id="reset-title" class="auth-card__title">Đặt lại mật khẩu</h2>
            <p class="auth-card__subtitle">Vui lòng nhập mật khẩu mới cho tài khoản của bạn.</p>

            <div class="auth-alerts" role="status">
                <div th:if="${error}" class="auth-alert auth-alert--error">
                    <i class="bi bi-exclamation-circle" aria-hidden="true"></i>
                    <span th:text="${error}">Thông báo lỗi</span>
                </div>
            </div>

            <form class="auth-form" th:action="@{/reset-password}" method="POST">
                <div class="field">
                    <div class="field__head">
                        <label class="field__label" for="newPassword">Mật khẩu mới <span class="req">*</span></label>
                        <span class="field__hint">8 - 64 ký tự</span>
                    </div>
                    <div class="field__control">
                        <input class="field__input has-toggle" type="password" id="newPassword" name="newPassword"
                               minlength="8" maxlength="64" required autocomplete="new-password"
                               placeholder="Nhập mật khẩu mới" aria-describedby="newPassword-strength-text">
                        <i class="bi bi-lock field__icon" aria-hidden="true"></i>
                        <button type="button" class="field__toggle" data-toggle-password="newPassword"
                                aria-label="Hiện mật khẩu" aria-pressed="false">
                            <i class="bi bi-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                    <div class="strength" data-strength-for="newPassword" data-strength-label="newPassword-strength-text"
                         data-level="0" aria-hidden="true">
                        <span></span><span></span><span></span><span></span>
                    </div>
                    <p id="newPassword-strength-text" class="strength__text" aria-live="polite">Tối thiểu 8 ký tự</p>
                </div>

                <div class="field">
                    <div class="field__head">
                        <label class="field__label" for="confirmPassword">Xác minh mật khẩu mới <span class="req">*</span></label>
                    </div>
                    <div class="field__control">
                        <input class="field__input has-toggle" type="password" id="confirmPassword" name="confirmPassword"
                               minlength="8" maxlength="64" required autocomplete="new-password"
                               placeholder="Nhập lại mật khẩu mới" data-match="newPassword"
                               aria-describedby="confirmPassword-error">
                        <i class="bi bi-shield-lock field__icon" aria-hidden="true"></i>
                        <button type="button" class="field__toggle" data-toggle-password="confirmPassword"
                                aria-label="Hiện mật khẩu" aria-pressed="false">
                            <i class="bi bi-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                    <p id="confirmPassword-error" class="field__error" hidden>Mật khẩu xác minh không khớp</p>
                </div>

                <button type="submit" class="auth-btn">Đổi mật khẩu</button>
            </form>

            <div class="auth-center">
                <a class="auth-back" th:href="@{/login}" href="/login">
                    <i class="bi bi-arrow-left" aria-hidden="true"></i> Quay lại đăng nhập
                </a>
            </div>
        </section>
    </main>
</div>

</body>
</html>
