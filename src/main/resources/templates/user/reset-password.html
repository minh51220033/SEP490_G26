<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đặt lại mật khẩu</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 380px;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        .description {
            text-align: center;
            color: #666;
            font-size: 14px;
            line-height: 1.5;
        }

        .form-group {
            margin-top: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
        }

        input {
            width: 100%;
            padding: 11px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            width: 100%;
            padding: 11px;
            margin-top: 20px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        .alert-error {
            background-color: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Đặt Lại Mật Khẩu</h2>

    <p class="description">
        Vui lòng nhập mật khẩu mới cho tài khoản của bạn.
    </p>

    <div th:if="${error}"
         class="alert-error"
         th:text="${error}">
    </div>

    <form th:action="@{/reset-password}"
          method="POST">

        <div class="form-group">

            <label for="newPassword">
                Mật khẩu mới
            </label>

            <input type="password"
                   id="newPassword"
                   name="newPassword"
                   minlength="8"
                   maxlength="64"
                   required
                   autocomplete="new-password"
                   placeholder="Nhập mật khẩu mới...">

        </div>

        <div class="form-group">

            <label for="confirmPassword">
                Xác minh mật khẩu mới
            </label>

            <input type="password"
                   id="confirmPassword"
                   name="confirmPassword"
                   minlength="8"
                   maxlength="64"
                   required
                   autocomplete="new-password"
                   placeholder="Nhập lại mật khẩu mới...">

        </div>

        <button type="submit">
            Đổi Mật Khẩu
        </button>

    </form>

</div>

</body>
</html>
