<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/auth :: head('Xác minh OTP')}"></head>
<body>

<div class="auth">
    <aside th:replace="~{fragments/auth :: hero}"></aside>

    <main class="auth-main">
        <div class="auth-main__mobile-brand">
            <a th:replace="~{fragments/logo :: logo('dark')}"></a>
        </div>

        <section class="auth-card" aria-labelledby="otp-title">
            <div class="auth-card__icon" aria-hidden="true"><i class="bi bi-envelope-check"></i></div>
            <h2 id="otp-title" class="auth-card__title">Xác minh OTP</h2>
            <p class="auth-card__subtitle">
                Mã OTP đã được gửi đến email
                <strong th:text="${maskedEmail}">n***@gmail.com</strong>.
                Mã có hiệu lực trong <strong>5 phút</strong>.
            </p>

            <div class="auth-alerts" role="status">
                <div th:if="${error}" class="auth-alert auth-alert--error">
                    <i class="bi bi-exclamation-circle" aria-hidden="true"></i>
                    <span th:text="${error}">Thông báo lỗi</span>
                </div>
            </div>

            <form class="auth-form" th:action="@{/verify-otp}" method="POST">
                <div class="field">
                    <div class="field__head">
                        <label class="field__label" for="otp">Nhập mã gồm 6 chữ số</label>
                    </div>
                    <input class="otp-input" type="text" id="otp" name="otp"
                           maxlength="6" minlength="6" pattern="[0-9]{6}" inputmode="numeric"
                           required autocomplete="one-time-code" placeholder="000000" data-otp>
                </div>

                <button type="submit" class="auth-btn">Xác nhận OTP</button>

                <div class="auth-alert auth-alert--info">
                    <i class="bi bi-info-circle" aria-hidden="true"></i>
                    <span>Không thấy email? Hãy kiểm tra thư mục Spam hoặc Quảng cáo.</span>
                </div>
            </form>

            <div class="auth-center">
                <a class="auth-back" th:href="@{/login}" href="/login">
                    <i class="bi bi-arrow-left" aria-hidden="true"></i> Quay lại đăng nhập
                </a>
            </div>
        </section>
    </main>
</div>

</body>
</html>
