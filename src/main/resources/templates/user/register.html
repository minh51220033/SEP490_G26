<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/auth :: head('Đăng ký tài khoản')}"></head>
<body>

<div class="auth">
    <aside th:replace="~{fragments/auth :: hero}"></aside>

    <main class="auth-main">
        <div class="auth-main__mobile-brand">
            <a th:replace="~{fragments/logo :: logo('dark')}"></a>
        </div>

        <section class="auth-card" aria-labelledby="register-title">
            <h2 id="register-title" class="auth-card__title">Đăng ký tài khoản</h2>
            <p class="auth-card__subtitle">Tạo tài khoản để bắt đầu quản lý phòng khám của bạn</p>

            <div class="auth-alerts" role="status">
                <div th:if="${error}" class="auth-alert auth-alert--error">
                    <i class="bi bi-exclamation-circle" aria-hidden="true"></i>
                    <span th:text="${error}">Thông báo lỗi</span>
                </div>
                <div th:if="${success}" class="auth-alert auth-alert--success">
                    <i class="bi bi-check-circle" aria-hidden="true"></i>
                    <span th:text="${success}">Thông báo thành công</span>
                </div>
            </div>

            <form class="auth-form" th:action="@{/register}" method="POST">
                <div class="field">
                    <div class="field__head">
                        <label class="field__label" for="username">Tên đăng nhập <span class="req">*</span></label>
                    </div>
                    <div class="field__control">
                        <input class="field__input" type="text" id="username" name="username"
                               maxlength="50" required autocomplete="username" placeholder="Nhập tên đăng nhập">
                        <i class="bi bi-person field__icon" aria-hidden="true"></i>
                    </div>
                </div>

                <div class="auth-row">
                    <div class="field">
                        <div class="field__head">
                            <label class="field__label" for="email">Email <span class="req">*</span></label>
                        </div>
                        <div class="field__control">
                            <input class="field__input" type="email" id="email" name="email"
                                   maxlength="100" required autocomplete="email" placeholder="ten@email.com">
                            <i class="bi bi-envelope field__icon" aria-hidden="true"></i>
                        </div>
                    </div>
                    <div class="field">
                        <div class="field__head">
                            <label class="field__label" for="phoneNumber">Số điện thoại <span class="req">*</span></label>
                        </div>
                        <div class="field__control">
                            <input class="field__input" type="tel" id="phoneNumber" name="phoneNumber"
                                   maxlength="20" required autocomplete="tel" placeholder="09xx xxx xxx">
                            <i class="bi bi-telephone field__icon" aria-hidden="true"></i>
                        </div>
                    </div>
                </div>

                <div class="field">
                    <div class="field__head">
                        <label class="field__label" for="password">Mật khẩu <span class="req">*</span></label>
                        <span class="field__hint">8 - 64 ký tự</span>
                    </div>
                    <div class="field__control">
                        <input class="field__input has-toggle" type="password" id="password" name="password"
                               minlength="8" maxlength="64" required autocomplete="new-password"
                               placeholder="Nhập mật khẩu" aria-describedby="password-strength-text">
                        <i class="bi bi-lock field__icon" aria-hidden="true"></i>
                        <button type="button" class="field__toggle" data-toggle-password="password"
                                aria-label="Hiện mật khẩu" aria-pressed="false">
                            <i class="bi bi-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                    <div class="strength" data-strength-for="password" data-strength-label="password-strength-text"
                         data-level="0" aria-hidden="true">
                        <span></span><span></span><span></span><span></span>
                    </div>
                    <p id="password-strength-text" class="strength__text" aria-live="polite">Tối thiểu 8 ký tự</p>
                </div>

                <div class="field">
                    <div class="field__head">
                        <label class="field__label" for="confirmPassword">Xác minh mật khẩu <span class="req">*</span></label>
                    </div>
                    <div class="field__control">
                        <input class="field__input has-toggle" type="password" id="confirmPassword" name="confirmPassword"
                               minlength="8" maxlength="64" required autocomplete="new-password"
                               placeholder="Nhập lại mật khẩu" data-match="password"
                               aria-describedby="confirmPassword-error">
                        <i class="bi bi-shield-lock field__icon" aria-hidden="true"></i>
                        <button type="button" class="field__toggle" data-toggle-password="confirmPassword"
                                aria-label="Hiện mật khẩu" aria-pressed="false">
                            <i class="bi bi-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                    <p id="confirmPassword-error" class="field__error" hidden>Mật khẩu xác minh không khớp</p>
                </div>

                <button type="submit" class="auth-btn">Đăng ký</button>
            </form>

            <p class="auth-links">
                Đã có tài khoản?
                <a th:href="@{/login}" href="/login">Đăng nhập ngay</a>
            </p>
        </section>
    </main>
</div>

</body>
</html>
