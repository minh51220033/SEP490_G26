<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 400px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }

        button:hover {
            background-color: #218838;
        }

        .alert-error {
            background-color: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            text-align: center;
        }

        .alert-success {
            background-color: #d4edda;
            color: #155724;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            text-align: center;
        }

        .links {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Đăng Ký Tài Khoản</h2>

    <div th:if="${error}"
         class="alert-error"
         th:text="${error}">
    </div>

    <div th:if="${success}"
         class="alert-success"
         th:text="${success}">
    </div>

    <form th:action="@{/register}"
          method="POST">

        <!-- Tên đăng nhập -->
        <div class="form-group">
            <label for="username">Tên đăng nhập</label>

            <input type="text"
                   id="username"
                   name="username"
                   maxlength="50"
                   required
                   autocomplete="username"
                   placeholder="Nhập tên đăng nhập...">
        </div>

        <!-- Mật khẩu -->
        <div class="form-group">
            <label for="password">Mật khẩu</label>

            <input type="password"
                   id="password"
                   name="password"
                   minlength="8"
                   maxlength="64"
                   required
                   autocomplete="new-password"
                   placeholder="Nhập mật khẩu...">
        </div>

        <!-- Xác minh mật khẩu -->
        <div class="form-group">
            <label for="confirmPassword">Xác minh mật khẩu</label>

            <input type="password"
                   id="confirmPassword"
                   name="confirmPassword"
                   minlength="8"
                   maxlength="64"
                   required
                   autocomplete="new-password"
                   placeholder="Nhập lại mật khẩu...">
        </div>

        <!-- Email -->
        <div class="form-group">
            <label for="email">Email</label>

            <input type="email"
                   id="email"
                   name="email"
                   maxlength="100"
                   required
                   autocomplete="email"
                   placeholder="Nhập email...">
        </div>

        <!-- Số điện thoại -->
        <div class="form-group">
            <label for="phoneNumber">Số điện thoại</label>

            <input type="tel"
                   id="phoneNumber"
                   name="phoneNumber"
                   maxlength="20"
                   required
                   autocomplete="tel"
                   placeholder="Nhập số điện thoại...">
        </div>

        <button type="submit">
            Đăng Ký
        </button>

    </form>

    <div class="links">
        Đã có tài khoản?
        <a href="/login">Đăng nhập ngay</a>
    </div>

</div>

</body>
</html>
