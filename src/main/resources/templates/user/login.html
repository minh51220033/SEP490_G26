<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/auth :: head('Đăng nhập')}"></head>
<body>

<div class="auth">
    <aside th:replace="~{fragments/auth :: hero}"></aside>

    <main class="auth-main">
        <div class="auth-main__mobile-brand">
            <a th:replace="~{fragments/logo :: logo('dark')}"></a>
        </div>

        <section class="auth-card" aria-labelledby="login-title">
            <h2 id="login-title" class="auth-card__title">Đăng nhập</h2>
            <p class="auth-card__subtitle">Nhập thông tin tài khoản để tiếp tục</p>

            <div class="auth-alerts" role="status">
                <div th:if="${error != null}" class="auth-alert auth-alert--error">
                    <i class="bi bi-exclamation-circle" aria-hidden="true"></i>
                    <span th:text="${error}">Thông báo lỗi</span>
                </div>
                <div th:if="${success != null}" class="auth-alert auth-alert--success">
                    <i class="bi bi-check-circle" aria-hidden="true"></i>
                    <span th:text="${success}">Thông báo thành công</span>
                </div>
                <div th:if="${notification != null}" class="auth-alert auth-alert--info">
                    <i class="bi bi-info-circle" aria-hidden="true"></i>
                    <span th:text="${notification}">Thông báo</span>
                </div>
            </div>

            <form class="auth-form" th:action="@{/login}" method="POST">
                <div class="field">
                    <div class="field__head">
                        <label class="field__label" for="username">Tên tài khoản <span class="req">*</span></label>
                    </div>
                    <div class="field__control">
                        <input class="field__input" type="text" id="username" name="username"
                               required autocomplete="username" placeholder="Nhập tên đăng nhập">
                        <i class="bi bi-person field__icon" aria-hidden="true"></i>
                    </div>
                </div>

                <div class="field">
                    <div class="field__head">
                        <label class="field__label" for="password">Mật khẩu <span class="req">*</span></label>
                        <a class="auth-link" th:href="@{/forgot-password}" href="/forgot-password">Quên mật khẩu?</a>
                    </div>
                    <div class="field__control">
                        <input class="field__input has-toggle" type="password" id="password" name="password"
                               required autocomplete="current-password" placeholder="Nhập mật khẩu">
                        <i class="bi bi-lock field__icon" aria-hidden="true"></i>
                        <button type="button" class="field__toggle" data-toggle-password="password"
                                aria-label="Hiện mật khẩu" aria-pressed="false">
                            <i class="bi bi-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                    <p class="field__hint" style="margin:6px 0 0">Phân biệt chữ hoa / chữ thường</p>
                </div>

                <button type="submit" class="auth-btn">Đăng nhập</button>

                <div class="auth-alert auth-alert--warning">
                    <i class="bi bi-exclamation-triangle" aria-hidden="true"></i>
                    <span>1 tài khoản chỉ được đăng nhập đồng thời trên 1 máy tính và 1 điện thoại/tablet.</span>
                </div>
            </form>

            <p class="auth-links">
                Chưa có tài khoản?
                <a th:href="@{/register}" href="/register">Đăng ký ngay</a>
            </p>
        </section>
    </main>
</div>

</body>
</html>
