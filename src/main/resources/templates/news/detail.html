<!DOCTYPE html>
<html lang="vi" xmlns:th="[http://www.thymeleaf.org](http://www.thymeleaf.org)">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${news.title}">Tin tức</title>

    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #f7f7f7; color: #222; font-family: Georgia, "Times New Roman", serif; }
        .header { background: white; border-bottom: 1px solid #ddd; padding: 18px; }
        .header-inner { max-width: 900px; margin: auto; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-family: Arial, sans-serif; font-weight: bold; color: #2563eb; text-decoration: none; font-size: 20px; }
        .container { max-width: 900px; margin: 35px auto; padding: 0 20px; }
        .article { background: white; padding: 40px; border-radius: 12px; }
        .article-title { font-size: 42px; line-height: 1.2; margin: 0 0 15px; }
        .meta { color: #777; font-family: Arial, sans-serif; font-size: 13px; margin-bottom: 25px; }
        .article-thumbnail { width: 100%; max-height: 500px; object-fit: cover; margin-bottom: 30px; border-radius: 8px; }
        .article-content { font-size: 18px; line-height: 1.8; }
        .article-content img { max-width: 100% !important; height: auto !important; display: block; margin: 15px auto; border-radius: 8px; }

        .comments { margin-top: 30px; background: white; padding: 30px; border-radius: 12px; font-family: Arial, sans-serif; }
        .comment-form textarea, .edit-form textarea, .reply-form textarea {
            width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; resize: vertical;
        }
        .btn { margin-top: 8px; padding: 8px 14px; border: none; border-radius: 7px; cursor: pointer; font-weight: 600; font-size: 13px; }
        .btn-primary { background: #2563eb; color: white; }
        .btn-secondary { background: #eef2f7; color: #374151; }

        .comment { border-top: 1px solid #eee; padding: 20px 0; }
        .comment-header { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; background: #e5e7eb; }
        .comment-user { font-weight: bold; }
        .comment-date { color: #888; font-size: 12px; }
        .comment-content { margin: 10px 0; line-height: 1.5; }
        .comment-actions { display: flex; align-items: center; gap: 12px; margin-top: 6px; }

        .action-btn { border: none; background: transparent; cursor: pointer; color: #555; padding: 0; font-size: 13px; }
        .action-btn:hover { color: #2563eb; }
        .action-btn-danger:hover { color: #dc2626; }

        .reply { margin-left: 50px; padding: 15px 0; border-top: 1px solid #f0f0f0; }
        .reply-form, .edit-form { margin-top: 10px; display: none; }
        .reply-form.show, .edit-form.show { display: block; }

        .admin-controls { display: inline-flex; gap: 6px; margin-left: auto; }
        .btn-admin-del { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; padding: 3px 8px; border-radius: 5px; font-size: 12px; cursor: pointer; }
        .btn-admin-ban { background: #fffbebfb; color: #d97706; border: 1px solid #fde68a; padding: 3px 8px; border-radius: 5px; font-size: 12px; cursor: pointer; }

        .alert-error { background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-weight: 500; }
        .alert-success { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-weight: 500; }
        .alert-ban { background: #fef2f2; border: 2px dashed #ef4444; color: #991b1b; padding: 16px; border-radius: 8px; margin-bottom: 20px; font-weight: bold; }
    </style>
</head>

<body>

<header class="header">
    <div class="header-inner">
        <a href="/" class="logo">CV-DCMS</a>
        <a href="/admin/news" style="text-decoration: none; color: #2563eb; font-weight: bold;"
           th:if="${session.loggedInUser != null and session.loggedInUser.role != null and session.loggedInUser.role.roleName == 'ADMIN'}">← Quản lý tin tức</a>
    </div>
</header>

<div class="container">

    <article class="article">
        <h1 class="article-title" th:text="${news.title}">Tiêu đề bài viết</h1>

        <div class="meta">
            <span>Đăng ngày: </span>
            <span th:if="${news.publishedAt != null}" th:text="${#temporals.format(news.publishedAt, 'dd/MM/yyyy HH:mm')}">03/10/2026</span>
            <span> · Tác giả: </span>
            <strong th:text="${news.createdBy != null ? (news.createdBy.fullName != null ? news.createdBy.fullName : news.createdBy.username) : 'Admin'}">Admin</strong>
        </div>

        <img th:if="${news.thumbnail != null and !#strings.isEmpty(news.thumbnail)}"
             th:src="@{${news.thumbnail}}" th:alt="${news.title}" class="article-thumbnail">

        <div class="article-content" th:utext="${news.content}"></div>
    </article>

    <!-- BÌNH LUẬN -->
    <section class="comments">
        <h2>Bình luận</h2>

        <!-- THÔNG BÁO FLASH MESSAGE -->
        <div class="alert-error" th:if="${commentError}" th:text="${commentError}"></div>
        <div class="alert-success" th:if="${commentSuccess}" th:text="${commentSuccess}"></div>

        <!-- THÔNG BÁO DÀNH CHO TÀI KHOẢN BỊ BAN -->
        <div class="alert-ban" th:if="${isBanned}">
            🚫 <span th:text="${banMessage}">Tài khoản của bạn hiện đang bị cấm bình luận.</span>
        </div>

        <!-- FORM TẠO BÌNH LUẬN (CHỈ HIỆN KHI ĐÃ ĐĂNG NHẬP VÀ KHÔNG BỊ BAN) -->
        <div th:if="${session.loggedInUser != null and !isBanned}">
            <form th:action="@{'/news/' + ${news.newsId} + '/comments'}" method="post" class="comment-form">
                <textarea name="content" rows="3" maxlength="2000" placeholder="Viết bình luận của bạn..." required></textarea>
                <button type="submit" class="btn btn-primary">Đăng bình luận</button>
            </form>
        </div>

        <div th:if="${session.loggedInUser == null}" style="padding: 15px; background: #f3f4f6; border-radius: 8px;">
            Vui lòng <a href="/login" style="color: #2563eb;">đăng nhập</a> để bình luận.
        </div>

        <!-- DANH SÁCH BÌNH LUẬN -->
        <div class="comment" th:each="comment : ${comments}">
            <div class="comment-header">
                <img th:if="${comment.user.avatar != null and !#strings.isEmpty(comment.user.avatar)}"
                     th:src="@{${comment.user.avatar}}" class="avatar" alt="Avatar">

                <div>
                    <div class="comment-user" th:text="${comment.user.fullName != null ? comment.user.fullName : comment.user.username}">Người dùng</div>
                    <div class="comment-date" th:text="${#temporals.format(comment.createdAt, 'dd/MM/yyyy HH:mm')}">03/10/2026</div>
                </div>

                <!-- ADMIN ACTION BUTTONS -->
                <div th:if="${session.loggedInUser != null and session.loggedInUser.role != null and session.loggedInUser.role.roleName == 'ADMIN'}" class="admin-controls">
                    <form th:action="@{'/admin/comments/' + ${comment.commentId} + '/delete'}" method="post" style="display:inline;" onsubmit="return confirm('Xóa bình luận này?');">
                        <button type="submit" class="btn-admin-del">🗑️ Xóa</button>
                    </form>

                    <form th:if="${comment.user.userId != session.loggedInUser.userId and (comment.user.role == null or comment.user.role.roleName != 'ADMIN')}"
                          th:action="@{'/admin/comments/' + ${comment.commentId} + '/ban'}" method="post" style="display:inline;" onsubmit="return confirm('Cấm (Ban) người dùng này?');">
                        <input type="hidden" name="reason" value="Vi phạm quy định bình luận">
                        <button type="submit" class="btn-admin-ban">🚫 Ban User</button>
                    </form>
                </div>
            </div>

            <!-- NỘI DUNG BÌNH LUẬN -->
            <div class="comment-content" th:id="'comment-text-' + ${comment.commentId}" th:text="${comment.content}">Nội dung bình luận</div>

            <!-- FORM CHỈNH SỬA BÌNH LUẬN -->
            <div class="edit-form" th:id="'edit-form-' + ${comment.commentId}">
                <form th:action="@{'/comments/' + ${comment.commentId} + '/edit'}" method="post">
                    <textarea name="content" rows="3" required th:text="${comment.content}"></textarea>
                    <button type="submit" class="btn btn-primary">Lưu chỉnh sửa</button>
                    <button type="button" class="btn btn-secondary" th:onclick="'toggleEdit(' + ${comment.commentId} + ')'">Hủy</button>
                </form>
            </div>

            <div class="comment-actions">
                <!-- NÚT LIKE -->
                <form th:action="@{'/comments/' + ${comment.commentId} + '/like'}" method="post" style="display:inline;">
                    <button type="submit" class="action-btn">
                        ❤️ <span th:text="${likeCounts[comment.commentId] != null ? likeCounts[comment.commentId] : 0}">0</span>
                    </button>
                </form>

                <!-- NÚT REPLY (ẨN NẾU BỊ BAN) -->
                <button th:if="${!isBanned}" type="button" class="action-btn" th:onclick="'toggleReply(' + ${comment.commentId} + ')'">↩ Trả lời</button>

                <!-- NÚT SỬA & XÓA CỦA CHÍNH TÁC GIẢ BÌNH LUẬN (CHỈ HIỆN KHI KHÔNG BỊ BAN) -->
                <th:block th:if="${session.loggedInUser != null and session.loggedInUser.userId == comment.user.userId and !isBanned}">
                    <button type="button" class="action-btn" th:onclick="'toggleEdit(' + ${comment.commentId} + ')'">✏️ Sửa</button>

                    <form th:action="@{'/comments/' + ${comment.commentId} + '/delete'}" method="post" style="display:inline;" onsubmit="return confirm('Bạn có chắc muốn xóa bình luận này?');">
                        <button type="submit" class="action-btn action-btn-danger">🗑️ Xóa</button>
                    </form>
                </th:block>
            </div>

            <!-- FORM TRẢ LỜI (REPLY) -->
            <div class="reply-form" th:id="'reply-form-' + ${comment.commentId}" th:if="${!isBanned}">
                <form th:action="@{'/comments/' + ${comment.commentId} + '/reply'}" method="post">
                    <textarea name="content" rows="2" maxlength="2000" placeholder="Viết phản hồi..." required></textarea>
                    <button type="submit" class="btn btn-primary">Gửi phản hồi</button>
                </form>
            </div>

            <!-- DANH SÁCH REPLIES -->
            <div class="reply" th:each="reply : ${repliesByComment[comment.commentId]}">
                <div class="comment-header">
                    <img th:if="${reply.user.avatar != null and !#strings.isEmpty(reply.user.avatar)}"
                         th:src="@{${reply.user.avatar}}" class="avatar" alt="Avatar">

                    <div>
                        <div class="comment-user" th:text="${reply.user.fullName != null ? reply.user.fullName : reply.user.username}">User</div>
                        <div class="comment-date" th:text="${#temporals.format(reply.createdAt, 'dd/MM/yyyy HH:mm')}">03/10/2026</div>
                    </div>

                    <div th:if="${session.loggedInUser != null and session.loggedInUser.role != null and session.loggedInUser.role.roleName == 'ADMIN'}" class="admin-controls">
                        <form th:action="@{'/admin/comments/' + ${reply.commentId} + '/delete'}" method="post" style="display:inline;" onsubmit="return confirm('Xóa phản hồi này?');">
                            <button type="submit" class="btn-admin-del">🗑️ Xóa</button>
                        </form>
                    </div>
                </div>

                <div class="comment-content" th:id="'comment-text-' + ${reply.commentId}" th:text="${reply.content}">Reply</div>

                <!-- FORM CHỈNH SỬA REPLY -->
                <div class="edit-form" th:id="'edit-form-' + ${reply.commentId}">
                    <form th:action="@{'/comments/' + ${reply.commentId} + '/edit'}" method="post">
                        <textarea name="content" rows="2" required th:text="${reply.content}"></textarea>
                        <button type="submit" class="btn btn-primary">Lưu chỉnh sửa</button>
                        <button type="button" class="btn btn-secondary" th:onclick="'toggleEdit(' + ${reply.commentId} + ')'">Hủy</button>
                    </form>
                </div>

                <div class="comment-actions">
                    <form th:action="@{'/comments/' + ${reply.commentId} + '/like'}" method="post" style="display:inline;">
                        <button type="submit" class="action-btn">
                            ❤️ <span th:text="${likeCounts[reply.commentId] != null ? likeCounts[reply.commentId] : 0}">0</span>
                        </button>
                    </form>

                    <th:block th:if="${session.loggedInUser != null and session.loggedInUser.userId == reply.user.userId and !isBanned}">
                        <button type="button" class="action-btn" th:onclick="'toggleEdit(' + ${reply.commentId} + ')'">✏️ Sửa</button>

                        <form th:action="@{'/comments/' + ${reply.commentId} + '/delete'}" method="post" style="display:inline;" onsubmit="return confirm('Bạn có chắc muốn xóa phản hồi này?');">
                            <button type="submit" class="action-btn action-btn-danger">🗑️ Xóa</button>
                        </form>
                    </th:block>
                </div>
            </div>
        </div>
    </section>

</div>

<script>
    function toggleReply(commentId) {
        const element = document.getElementById("reply-form-" + commentId);
        if (element) element.classList.toggle("show");
    }

    function toggleEdit(commentId) {
        const textElement = document.getElementById("comment-text-" + commentId);
        const formElement = document.getElementById("edit-form-" + commentId);
        if (formElement) {
            formElement.classList.toggle("show");
            if (textElement) {
                textElement.style.display = formElement.classList.contains("show") ? "none" : "block";
            }
        }
    }
</script>
</body>
</html>
