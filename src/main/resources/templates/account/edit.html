<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Sửa tài khoản</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow-sm">

                <div class="card-header">

                    <h4 class="mb-0">
                        Sửa thông tin tài khoản
                    </h4>

                </div>


                <div class="card-body">

                    <!-- ERROR -->
                    <div
                            th:if="${error}"
                            class="alert alert-danger"
                            th:text="${error}">
                        Có lỗi
                    </div>


                    <!-- USERNAME READ ONLY -->
                    <div class="mb-3">

                        <label class="form-label">
                            Username
                        </label>

                        <input
                                type="text"
                                class="form-control"
                                th:value="${account.username}"
                                readonly>

                    </div>


                    <form
                            th:action="@{/accounts/{id}/edit(id=${account.userId})}"
                            th:object="${accountUpdateDTO}"
                            method="post">


                        <!-- FULL NAME -->
                        <div class="mb-3">

                            <label class="form-label">
                                Họ và tên
                            </label>

                            <input
                                    type="text"
                                    class="form-control"
                                    th:field="*{fullName}"
                                    maxlength="100">

                        </div>


                        <!-- EMAIL -->
                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                    type="email"
                                    class="form-control"
                                    th:field="*{email}">

                        </div>


                        <!-- PHONE -->
                        <div class="mb-4">

                            <label class="form-label">
                                Số điện thoại
                            </label>

                            <input
                                    type="text"
                                    class="form-control"
                                    th:field="*{phoneNumber}">

                        </div>


                        <!-- BUTTON -->
                        <div
                                class="d-flex justify-content-between">

                            <a
                                    th:href="@{/accounts/{id}(id=${account.userId})}"
                                    class="btn btn-secondary">
                                Hủy
                            </a>

                            <button
                                    type="submit"
                                    class="btn btn-primary">
                                Lưu thay đổi
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
