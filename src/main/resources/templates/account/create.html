<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Tạo tài khoản</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow-sm">

                <div class="card-header">

                    <h4 class="mb-0">
                        Tạo tài khoản
                    </h4>

                </div>


                <div class="card-body">

                    <!-- ERROR -->
                    <div
                            th:if="${error}"
                            class="alert alert-danger"
                            th:text="${error}">
                        Có lỗi xảy ra
                    </div>


                    <form
                            th:action="@{/accounts/create}"
                            th:object="${accountCreateDTO}"
                            method="post">


                        <!-- USERNAME -->
                        <div class="mb-3">

                            <label class="form-label">
                                Username
                                <span class="text-danger">*</span>
                            </label>

                            <input
                                    type="text"
                                    class="form-control"
                                    th:field="*{username}"
                                    required
                                    minlength="3"
                                    maxlength="50"
                                    placeholder="Nhập username">

                        </div>


                        <!-- FULL NAME -->
                        <div class="mb-3">

                            <label class="form-label">
                                Họ và tên
                            </label>

                            <input
                                    type="text"
                                    class="form-control"
                                    th:field="*{fullName}"
                                    maxlength="100"
                                    placeholder="Nguyễn Văn A">

                        </div>


                        <!-- EMAIL -->
                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                    type="email"
                                    class="form-control"
                                    th:field="*{email}"
                                    placeholder="example@gmail.com">

                        </div>


                        <!-- PHONE -->
                        <div class="mb-3">

                            <label class="form-label">
                                Số điện thoại
                            </label>

                            <input
                                    type="text"
                                    class="form-control"
                                    th:field="*{phoneNumber}"
                                    placeholder="0901234567">

                        </div>


                        <!-- PASSWORD -->
                        <div class="mb-3">

                            <label class="form-label">
                                Mật khẩu
                                <span class="text-danger">*</span>
                            </label>

                            <input
                                    type="password"
                                    class="form-control"
                                    th:field="*{password}"
                                    required
                                    minlength="6"
                                    placeholder="Nhập mật khẩu">

                        </div>


                        <!-- CONFIRM PASSWORD -->
                        <div class="mb-3">

                            <label class="form-label">
                                Xác nhận mật khẩu
                                <span class="text-danger">*</span>
                            </label>

                            <input
                                    type="password"
                                    class="form-control"
                                    th:field="*{confirmPassword}"
                                    required
                                    minlength="6"
                                    placeholder="Nhập lại mật khẩu">

                        </div>


                        <!-- ROLE -->
                        <div class="mb-4">

                            <label class="form-label">
                                Role
                                <span class="text-danger">*</span>
                            </label>

                            <select
                                    class="form-select"
                                    th:field="*{roleId}"
                                    required>

                                <option value="">
                                    -- Chọn role --
                                </option>

                                <option
                                        th:each="role : ${roles}"
                                        th:value="${role.roleId}"
                                        th:text="${role.roleName}">
                                </option>

                            </select>

                        </div>


                        <!-- BUTTON -->
                        <div
                                class="d-flex justify-content-between">

                            <a
                                    th:href="@{/accounts}"
                                    class="btn btn-secondary">
                                Quay lại
                            </a>

                            <button
                                    type="submit"
                                    class="btn btn-primary">
                                Tạo tài khoản
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
