<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${status + ' · ' + title}">Thông báo</title>
<style>body{margin:0;background:#f5f8fc;color:#1e293b;font:16px/1.6 Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.card{background:#fff;max-width:520px;margin:24px;padding:36px;border:1px solid #e2e8f0;border-radius:16px;box-shadow:0 12px 36px #1e293b12}.code{color:#2457a7;font-size:14px;font-weight:700}.card h1{font-size:25px;margin:8px 0}.card p{color:#475569}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}a{display:inline-block;padding:10px 16px;border-radius:8px;text-decoration:none;background:#2457a7;color:#fff}a.secondary{background:#e8eef8;color:#2457a7}</style></head>
<body><main class="card" role="alert"><span class="code" th:text="${'Lỗi ' + status}">Lỗi</span><h1 th:text="${title}">Thông báo</h1><p th:text="${description}">Vui lòng thử lại.</p><div class="actions"><a th:if="${status == 401}" th:href="@{/login}">Đăng nhập</a><a class="secondary" th:href="@{/home}">Về trang chủ</a></div></main></body></html>
