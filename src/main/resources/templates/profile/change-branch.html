<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Thay đổi cơ sở khám chữa bệnh')}"></head>
<body class="app-body">
<div class="app-shell">

<style>
    .cb-wrap {
        max-width: 820px;
        margin: 0 auto;
    }
    .cb-card {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
        overflow: hidden;
    }
    .cb-card__head {
        padding: 16px 22px;
        background: #f8fafc;
        border-bottom: 1px solid #f1f5f9;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
    }
    .cb-card__title {
        font-size: 16px;
        font-weight: 700;
        color: #0f172a;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .cb-card__title i {
        color: #0284c7;
    }
    .cb-card__body {
        padding: 24px;
    }
    .cb-current {
        background: #f0f9ff;
        border: 1px solid #bae6fd;
        border-radius: 10px;
        padding: 14px 18px;
        margin-bottom: 20px;
    }
</style>

<aside th:replace="~{fragments/sidebar :: sidebar('profile')}"></aside>
<div th:replace="~{fragments/sidebar :: sidebarBackdrop}"></div>

<div class="app-main">
    <header th:replace="~{fragments/header :: appTopbar('Thay đổi cơ sở khám chữa bệnh')}"></header>

    <main class="app-content">
        <div class="cb-wrap">

            <div class="d-flex align-items-center justify-content-between mb-3">
                <div class="d-flex align-items-center gap-2 text-secondary small">
                    <a th:href="@{/profile}" class="text-decoration-none text-secondary">
                        <i class="bi bi-person-vcard me-1"></i>Thông tin cá nhân
                    </a>
                    <i class="bi bi-chevron-right" style="font-size:11px;"></i>
                    <span class="fw-semibold text-dark">Đổi cơ sở khám</span>
                </div>
                <a th:href="@{/profile}" class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i>Quay lại hồ sơ
                </a>
            </div>

            <div th:if="${error != null}" class="alert alert-danger d-flex align-items-center gap-2 mb-3 shadow-sm" role="alert" style="border-radius:10px;">
                <i class="bi bi-exclamation-triangle-fill fs-5"></i>
                <span th:text="${error}">Đã xảy ra lỗi.</span>
            </div>

            <div class="cb-card">
                <div class="cb-card__head">
                    <h2 class="cb-card__title">
                        <i class="bi bi-buildings-fill"></i> Chọn cơ sở khám chữa bệnh ưu tiên
                    </h2>
                </div>
                <div class="cb-card__body">

                    <div class="cb-current">
                        <div class="small text-secondary fw-semibold mb-1">Cơ sở hiện tại của tài khoản:</div>
                        <div class="fw-bold text-primary fs-6"
                             th:text="${currentBranch != null ? currentBranch.branchName : 'Chưa thiết lập cơ sở'}">Cơ sở chính</div>
                        <div class="small text-muted mt-1"
                             th:if="${currentBranch != null and currentBranch.address != null}"
                             th:text="${currentBranch.address}">Địa chỉ</div>
                    </div>

                    <form th:action="@{/profile/change-branch}" method="post">
                        <div class="mb-3">
                            <label for="branchSelect" class="form-label fw-semibold text-dark">
                                Chọn cơ sở khám mới <span class="text-danger">*</span>
                            </label>
                            <select id="branchSelect" name="branchId" class="form-select" required>
                                <option value="">-- Chọn cơ sở khám chữa bệnh --</option>
                                <option th:each="b : ${branches}"
                                        th:value="${b.branchId}"
                                        th:selected="${currentBranch != null and b.branchId == currentBranch.branchId}"
                                        th:text="${b.branchName + (b.address != null ? ' — ' + b.address : '')}">
                                </option>
                            </select>
                            <div class="form-text mt-2">
                                <i class="bi bi-info-circle me-1"></i>Khi thay đổi cơ sở, toàn bộ hồ sơ bệnh nhân thuộc tài khoản này sẽ được đồng bộ sang cơ sở mới để thuận tiện đặt lịch khám.
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                            <a th:href="@{/profile}" class="btn btn-outline-secondary px-3">Hủy bỏ</a>
                            <button type="submit" class="btn btn-primary px-4 fw-semibold">
                                <i class="bi bi-check2-circle me-1"></i> Lưu cơ sở khám mới
                            </button>
                        </div>
                    </form>

                </div>
            </div>

        </div>
    </main>

    <footer th:replace="~{fragments/footer :: appFooter}"></footer>
</div>
</div>
</body>
</html>
