<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Đổi mật khẩu</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .container {
            width: 420px;
            max-width: calc(100% - 30px);
            margin: 60px auto;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        .description {
            text-align: center;
            color: #6b7280;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        .error {
            color: #dc2626;
            background: #fef2f2;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .validation-error {
            color: #dc2626;
            margin-top: 5px;
            font-size: 13px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #2563eb;
            text-decoration: none;
            font-size: 14px;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <h1>Đổi mật khẩu</h1>

        <p class="description">
            Nhập mật khẩu hiện tại và mật khẩu mới của bạn.
        </p>


        <!-- Lỗi nghiệp vụ -->
        <div th:if="${error}"
             class="error"
             th:text="${error}">
            Lỗi
        </div>


        <form th:action="@{/profile/change-password}"
              th:object="${changePasswordDTO}"
              method="post">


            <div class="form-group">

                <label>
                    Mật khẩu hiện tại
                </label>

                <input type="password"
                       th:field="*{currentPassword}"
                       required>

                <div class="validation-error"
                     th:if="${#fields.hasErrors('currentPassword')}"
                     th:errors="*{currentPassword}">
                </div>

            </div>


            <div class="form-group">

                <label>
                    Mật khẩu mới
                </label>

                <input type="password"
                       th:field="*{newPassword}"
                       pattern="^(?=.*[A-Za-z])(?=.*\d).{6,100}$"
                       title="Mật khẩu phải có ít nhất 6 ký tự, gồm chữ cái và số."
                       required>

                <div class="validation-error"
                     th:if="${#fields.hasErrors('newPassword')}"
                     th:errors="*{newPassword}">
                </div>

            </div>


            <div class="form-group">

                <label>
                    Xác nhận mật khẩu mới
                </label>

                <input type="password"
                       th:field="*{confirmPassword}"
                       required>

                <div class="validation-error"
                     th:if="${#fields.hasErrors('confirmPassword')}"
                     th:errors="*{confirmPassword}">
                </div>

            </div>


            <button type="submit">
                🔐 Đổi mật khẩu
            </button>

        </form>


        <a href="/profile"
           class="back">
            ← Quay lại thông tin cá nhân
        </a>

    </div>

</div>

</body>
</html>
