<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Hoàn thiện hồ sơ bệnh nhân')}"></head>
<body class="app-body">
<div class="app-shell">

<style>
    .cm-wrap {
        max-width: 1020px;
        margin: 0 auto;
    }
    .cm-banner {
        background: linear-gradient(135deg, #0f172a 0%, #0284c7 100%);
        color: #ffffff;
        border-radius: 12px;
        padding: 20px 24px;
        margin-bottom: 20px;
    }
    .cm-card {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
        padding: 22px;
        margin-bottom: 18px;
    }
    .cm-grid-2 {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
    }
    @media (max-width: 768px) {
        .cm-grid-2 {
            grid-template-columns: 1fr;
        }
    }
</style>

<aside th:replace="~{fragments/sidebar :: sidebar('profile')}"></aside>
<div th:replace="~{fragments/sidebar :: sidebarBackdrop}"></div>

<div class="app-main">
    <header th:replace="~{fragments/header :: appTopbar('Hoàn thiện hồ sơ bệnh nhân')}"></header>

    <main class="app-content">
        <div class="cm-wrap">

            <div class="cm-banner">
                <h2 class="h5 fw-bold mb-1">
                    <i class="bi bi-stars me-1"></i>Chào mừng bạn đến với Hệ thống Nha khoa CV-DCMS!
                </h2>
                <p class="mb-0 small opacity-75">
                    Vui lòng hoàn thiện thông tin hồ sơ bệnh nhân mặc định của bạn (và có thể thêm hồ sơ người thân nếu muốn) để bắt đầu đặt lịch khám.
                </p>
            </div>

            <div th:if="${error != null}" class="alert alert-danger d-flex align-items-center gap-2 mb-3 shadow-sm" role="alert" style="border-radius:10px;">
                <i class="bi bi-exclamation-triangle-fill fs-5"></i>
                <span th:text="${error}">Đã xảy ra lỗi.</span>
            </div>

            <form th:action="@{/profile/complete}"
                  method="post"
                  enctype="multipart/form-data"
                  id="completeForm">

                <div id="profilesContainer">
                    <div class="cm-card profile-block" data-index="0">
                        <div class="d-flex align-items-center justify-content-between pb-3 mb-3 border-bottom">
                            <h3 class="h6 fw-bold text-primary mb-0 profile-heading">
                                <i class="bi bi-person-check-fill me-1"></i>Hồ sơ 1 (Hồ sơ mặc định của bạn)
                            </h3>
                            <button type="button"
                                    class="btn btn-sm btn-outline-danger remove-profile-btn"
                                    style="display:none;"
                                    onclick="removeProfileBlock(this)">
                                <i class="bi bi-trash me-1"></i>Xóa hồ sơ này
                            </button>
                        </div>

                        <div class="cm-grid-2 mb-3">
                            <div>
                                <label class="form-label fw-semibold">Họ và tên <span class="text-danger">*</span></label>
                                <input type="text" name="profiles[0].fullName" class="form-control" maxlength="100" required>
                            </div>
                            <div>
                                <label class="form-label fw-semibold">Ngày sinh</label>
                                <input type="date" name="profiles[0].dob" class="form-control">
                            </div>
                            <div>
                                <label class="form-label fw-semibold">Giới tính <span class="text-danger">*</span></label>
                                <select name="profiles[0].gender" class="form-select" required>
                                    <option value="">-- Chọn giới tính --</option>
                                    <option value="Nam">Nam</option>
                                    <option value="Nữ">Nữ</option>
                                    <option value="Khác">Khác</option>
                                </select>
                            </div>
                            <div>
                                <label class="form-label fw-semibold">Cơ sở khám ưu tiên <span class="text-danger">*</span></label>
                                <select name="profiles[0].branchId" class="form-select" required>
                                    <option value="">-- Chọn cơ sở khám --</option>
                                    <option th:each="b : ${branches}"
                                            th:value="${b.branchId}"
                                            th:text="${b.branchName}">
                                    </option>
                                </select>
                            </div>
                            <div style="grid-column: 1 / -1;">
                                <label class="form-label fw-semibold">Địa chỉ <span class="text-danger">*</span></label>
                                <input type="text" name="profiles[0].address" class="form-control" maxlength="255" required>
                            </div>
                        </div>

                        <div class="mb-3 p-3 bg-light rounded-3 border">
                            <label class="form-label fw-semibold mb-2">Tiền sử bệnh nền <span class="text-danger">*</span></label>
                            <div class="d-flex gap-4 mb-2">
                                <label class="d-inline-flex align-items-center gap-2">
                                    <input type="radio"
                                           name="profiles[0].hasUnderlyingDisease"
                                           value="false"
                                           checked
                                           onchange="toggleDiseaseField(this, false)">
                                    <span>Không</span>
                                </label>
                                <label class="d-inline-flex align-items-center gap-2">
                                    <input type="radio"
                                           name="profiles[0].hasUnderlyingDisease"
                                           value="true"
                                           onchange="toggleDiseaseField(this, true)">
                                    <span class="text-danger fw-semibold">Có bệnh nền</span>
                                </label>
                            </div>
                            <div class="disease-details-wrap" style="display:none;">
                                <label class="form-label fw-semibold">Mô tả chi tiết bệnh nền <span class="text-danger">*</span></label>
                                <textarea name="profiles[0].underlyingDiseaseDetails"
                                          rows="2"
                                          maxlength="1000"
                                          class="form-control"
                                          placeholder="Nhập thông tin bệnh nền hoặc dị ứng thuốc..."></textarea>
                            </div>
                        </div>

                        <div>
                            <label class="form-label fw-semibold">Ảnh đại diện (Tùy chọn — JPG, PNG, WebP tối đa 5MB)</label>
                            <input type="file" name="profiles[0].avatar" accept="image/jpeg,image/png,image/webp" class="form-control">
                        </div>
                    </div>
                </div>

                <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mt-3">
                    <button type="button" class="btn btn-outline-primary fw-semibold" onclick="addProfileBlock()">
                        <i class="bi bi-person-plus me-1"></i> Thêm hồ sơ người thân khác
                    </button>

                    <button type="submit" class="btn btn-primary px-4 fw-semibold">
                        <i class="bi bi-check2-circle me-1"></i> Hoàn tất &amp; Lưu hồ sơ
                    </button>
                </div>
            </form>

        </div>
    </main>

    <footer th:replace="~{fragments/footer :: appFooter}"></footer>
</div>
</div>

<script>
    function toggleDiseaseField(radio, show) {
        var card = radio.closest('.profile-block');
        var wrap = card.querySelector('.disease-details-wrap');
        var textarea = wrap.querySelector('textarea');
        if (show) {
            wrap.style.display = 'block';
            textarea.required = true;
        } else {
            wrap.style.display = 'none';
            textarea.required = false;
            textarea.value = '';
        }
    }

    function addProfileBlock() {
        var container = document.getElementById('profilesContainer');
        var blocks = container.querySelectorAll('.profile-block');
        var first = blocks[0];
        var clone = first.cloneNode(true);

        clone.querySelectorAll('input[type="text"], input[type="date"], input[type="file"], textarea').forEach(function (el) {
            el.value = '';
            el.required = false;
        });
        clone.querySelectorAll('input[name$=".fullName"], input[name$=".address"], select').forEach(function (el) {
            el.required = true;
        });
        clone.querySelectorAll('select').forEach(function (el) {
            el.selectedIndex = 0;
        });

        var radios = clone.querySelectorAll('input[type="radio"]');
        radios.forEach(function (r) {
            r.checked = (r.value === 'false');
        });
        var wrap = clone.querySelector('.disease-details-wrap');
        if (wrap) wrap.style.display = 'none';

        container.appendChild(clone);
        reindexBlocks();
    }

    function removeProfileBlock(btn) {
        var container = document.getElementById('profilesContainer');
        if (container.querySelectorAll('.profile-block').length <= 1) return;
        btn.closest('.profile-block').remove();
        reindexBlocks();
    }

    function reindexBlocks() {
        var blocks = document.querySelectorAll('#profilesContainer .profile-block');
        blocks.forEach(function (block, idx) {
            block.setAttribute('data-index', idx);
            var heading = block.querySelector('.profile-heading');
            if (heading) {
                heading.innerHTML = idx === 0
                    ? '<i class="bi bi-person-check-fill me-1"></i>Hồ sơ 1 (Hồ sơ mặc định của bạn)'
                    : '<i class="bi bi-person-plus-fill me-1"></i>Hồ sơ ' + (idx + 1) + ' (Người thân)';
            }
            var removeBtn = block.querySelector('.remove-profile-btn');
            if (removeBtn) {
                removeBtn.style.display = idx === 0 ? 'none' : 'inline-flex';
            }
            block.querySelectorAll('[name]').forEach(function (el) {
                el.name = el.name.replace(/profiles\[\d+\]/, 'profiles[' + idx + ']');
            });
        });
    }
</script>
</body>
</html>
