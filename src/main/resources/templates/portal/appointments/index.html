<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Lịch hẹn của tôi')}"></head>
<body class="app-body"><div class="app-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar('portal-appointments')}"></aside>
    <div th:replace="~{fragments/sidebar :: sidebarBackdrop}"></div>
    <div class="app-main">
        <header th:replace="~{fragments/header :: appTopbar('Lịch hẹn của tôi')}"></header>
        <main class="app-content">
            <link rel="stylesheet" th:href="@{/css/patients.css}">
            <link rel="stylesheet" th:href="@{/css/portal-appointments.css}">
            <div class="patient-page-heading">
                <div>
                    <h1>Lịch hẹn của tôi</h1>
                    <p>Theo dõi danh sách lịch hẹn khám, lịch tái khám chỉ định và tiến độ tiếp nhận.</p>
                </div>
                <a class="btn btn-primary shadow-sm" th:href="@{/portal/appointments/new}"><i class="bi bi-calendar-plus me-1"></i> Đặt lịch khám mới</a>
            </div>
            <div id="pageError" class="alert alert-danger" hidden></div>
            <section class="panel appointment-panel">
                <div class="mb-3">
                    <label for="profileFilter" class="form-label fw-bold text-dark mb-1">Hồ sơ bệnh nhân</label>
                    <select id="profileFilter" class="form-select appointment-filter" aria-label="Chọn hồ sơ bệnh nhân"></select>
                </div>
                <div class="table-responsive rounded-3 border">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th style="width: 170px;">Mã lịch</th>
                                <th style="width: 190px;">Ngày &amp; Buổi</th>
                                <th>Chi nhánh</th>
                                <th>Bác sĩ yêu cầu</th>
                                <th style="width: 170px;">Trạng thái</th>
                                <th class="text-end pe-3" style="width: 140px;">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="appointmentRows">
                            <tr><td colspan="6" class="text-muted text-center py-4">Đang tải danh sách lịch hẹn…</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
</div><script th:src="@{/js/portal-appointments.js}" defer></script></body></html>
