<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Chi tiết lịch hẹn')}"></head>
<body class="app-body"><div class="app-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar('portal-appointments')}"></aside>
    <div th:replace="~{fragments/sidebar :: sidebarBackdrop}"></div>
    <div class="app-main">
        <header th:replace="~{fragments/header :: appTopbar('Chi tiết lịch hẹn')}"></header>
        <main class="app-content">
            <link rel="stylesheet" th:href="@{/css/patients.css}">
            <link rel="stylesheet" th:href="@{/css/portal-appointments.css}">
            <div class="patient-page-heading">
                <div>
                    <a th:href="@{/portal/appointments}" class="text-decoration-none small text-muted"><i class="bi bi-arrow-left me-1"></i> Quay lại Lịch hẹn của tôi</a>
                    <h1 class="h3 fw-bold text-dark mt-1">Chi tiết lịch hẹn</h1>
                    <p id="appointmentCode" class="font-monospace text-primary fw-bold mb-0">Đang tải mã lịch…</p>
                </div>
            </div>
            <div id="pageError" class="alert alert-danger" hidden role="alert"></div>
            <div id="successMessage" class="alert alert-success" hidden role="status"></div>
            <section class="panel appointment-panel" id="appointmentDetail" th:attr="data-appointment-id=${appointmentId}">
                <div class="patient-facts" id="appointmentFacts"></div>
                <div id="appointmentActions" class="patient-form-actions mt-3 pt-3 border-top d-flex gap-2" hidden>
                    <a id="changeLink" class="btn btn-outline-primary" href="#"><i class="bi bi-calendar2-range me-1"></i> Đổi lịch khám</a>
                    <button id="cancelButton" class="btn btn-outline-danger" type="button"><i class="bi bi-x-circle me-1"></i> Hủy lịch</button>
                </div>
                <form id="cancelForm" class="appointment-availability is-error mt-3" hidden>
                    <h6 class="fw-bold text-danger mb-2"><i class="bi bi-exclamation-triangle-fill me-1"></i> Xác nhận yêu cầu hủy lịch</h6>
                    <label for="cancelReason" class="form-label small fw-semibold text-dark">Lý do hủy lịch *</label>
                    <select id="cancelReason" class="form-select form-select-sm" required>
                        <option value="">-- Chọn lý do --</option>
                        <option value="Bệnh nhân bận hoặc đổi kế hoạch">Bận hoặc đổi kế hoạch</option>
                        <option value="Không còn nhu cầu khám">Không còn nhu cầu khám</option>
                        <option value="Sức khỏe không phù hợp">Sức khỏe không phù hợp</option>
                        <option value="Đã đặt trùng lịch">Đã đặt trùng lịch</option>
                        <option value="Khác">Khác</option>
                    </select>
                    <label for="cancelNote" class="form-label small fw-semibold text-dark mt-2">Ghi chú thêm</label>
                    <input id="cancelNote" class="form-control form-control-sm" maxlength="180" placeholder="Chi tiết lý do (nếu chọn khác)...">
                    <button class="btn btn-danger btn-sm mt-3 px-3 fw-semibold" type="submit"><i class="bi bi-trash3 me-1"></i> Xác nhận hủy lịch hẹn</button>
                </form>
            </section>
            <section class="panel appointment-panel mt-3">
                <h2 class="h5 fw-bold text-dark mb-1"><i class="bi bi-clock-history text-primary me-1.5"></i> Lịch sử thay đổi &amp; tiến trình</h2>
                <p class="text-muted small mb-3">Toàn bộ diễn biến từ lúc đặt lịch, cập nhật hoặc tiếp nhận tại phòng khám.</p>
                <ul id="appointmentHistory" class="appointment-history p-0"></ul>
            </section>
        </main>
    </div>
</div><script th:src="@{/js/portal-appointments.js}" defer></script></body></html>
