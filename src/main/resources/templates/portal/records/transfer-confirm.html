<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Xác minh tách tài khoản')}"></head>
<body class="app-body"><div class="app-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar('home')}"></aside><div th:replace="~{fragments/sidebar :: sidebarBackdrop}"></div>
    <div class="app-main"><header th:replace="~{fragments/header :: appTopbar('Tách tài khoản')}"></header>
        <main class="app-content"><link rel="stylesheet" th:href="@{/css/patients.css}">
            <div class="patient-page-heading"><div><a th:href="@{/portal/records/{id}/transfer(id=${record.id})}">← Bước trước</a>
                <h1>Tách tài khoản · Bước 2/3</h1><p>Hồ sơ <strong th:text="${record.code}">BN</strong> sẽ được chuyển sang <strong th:text="${request.targetEmail}">email</strong>.</p></div></div>
            <section class="panel patient-detail">
                <p>Hai mã xác minh có hiệu lực 10 phút. Chủ tài khoản hiện tại và người nhận cần cùng xác nhận.</p>
                <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
                <form method="post" th:action="@{/portal/records/{id}/transfer/{requestId}(id=${record.id},requestId=${request.requestId})}" class="patient-form">
                    <div class="patient-form-grid">
                        <div><label for="ownerCode">Mã gửi tới email tài khoản hiện tại *</label><input id="ownerCode" name="ownerCode" class="form-control" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="one-time-code"></div>
                        <div><label for="targetCode">Mã gửi tới email tài khoản nhận *</label><input id="targetCode" name="targetCode" class="form-control" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></div>
                    </div>
                    <div th:unless="${request.existingAccount}">
                        <h2>Tạo tài khoản nhận mới</h2>
                        <div class="patient-form-grid">
                            <div><label for="username">Tên đăng nhập *</label><input id="username" name="username" class="form-control" pattern="[A-Za-z0-9][A-Za-z0-9._-]{3,49}" minlength="4" maxlength="50" required></div>
                            <div><label for="phoneNumber">Số điện thoại tài khoản *</label><input id="phoneNumber" name="phoneNumber" class="form-control" type="tel" pattern="0[0-9]{9,10}" maxlength="11" required></div>
                            <div><label for="password">Mật khẩu mới *</label><input id="password" name="password" class="form-control" type="password" minlength="8" required autocomplete="new-password"></div>
                        </div>
                    </div>
                    <div class="patient-form-actions"><button type="submit" class="btn btn-primary">Xác nhận chuyển hồ sơ</button></div>
                </form>
            </section>
        </main><footer th:replace="~{fragments/footer :: siteFooter}"></footer></div></div></body></html>
