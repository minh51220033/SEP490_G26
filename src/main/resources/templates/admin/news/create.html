<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Tạo bài viết')}"></head>

<body class="app-body">

<link rel="stylesheet" href="https://cdn.ckeditor.com/ckeditor5/43.0.0/ckeditor5.css">
<link rel="stylesheet" th:href="@{/css/news.css}">

<header th:replace="~{fragments/header :: siteHeader}"></header>

<div class="app-shell">

    <aside th:replace="~{fragments/sidebar :: sidebar('news')}"></aside>
    <div th:replace="~{fragments/sidebar :: sidebarBackdrop}"></div>

    <div class="app-main">

        <header th:replace="~{fragments/header :: appTopbar('Tạo bài viết')}"></header>

        <main class="app-content nw-page">

            <div class="nw-admin-head">
                <div>
                    <nav class="nw-breadcrumb" style="margin:0" aria-label="Breadcrumb">
                        <a th:href="@{/admin/news}">Quản lý tin tức</a>
                        <i class="bi bi-chevron-right" aria-hidden="true"></i>
                        <span aria-current="page">Tạo bài viết</span>
                    </nav>
                    <h1>Tạo bài viết</h1>
                    <p>Soạn và đăng tin tức cho phòng khám.</p>
                </div>
                <div class="nw-admin-head__actions">
                    <a th:href="@{/admin/news}" class="nw-btn nw-btn--ghost">
                        <i class="bi bi-arrow-left"></i> Quay lại
                    </a>
                </div>
            </div>

            <div class="nw-alert nw-alert--error" role="alert" th:if="${error}">
                <i class="bi bi-exclamation-circle"></i>
                <span th:text="${error}">Có lỗi xảy ra.</span>
            </div>

            <form id="newsForm" th:action="@{/admin/news}" th:object="${newsCreateDTO}" method="post"
                  th:attr="data-upload-url=@{/admin/news/upload/image}" class="nw-form-grid">

                <!-- CỘT TRÁI: NỘI DUNG -->
                <div class="nw-form-main">
                    <section class="nw-card nw-card--pad">
                        <h2 class="nw-section-title"><i class="bi bi-file-earmark-text"></i> Thông tin bài viết</h2>

                        <div class="nw-group">
                            <label class="nw-label" for="title">
                                Tiêu đề <span class="nw-required">*</span>
                                <span class="nw-counter" id="titleCounter">0/200</span>
                            </label>
                            <input class="nw-input" type="text" id="title" th:field="*{title}" maxlength="200"
                                   data-counter="titleCounter" placeholder="Nhập tiêu đề bài viết..." required>
                            <div class="nw-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                        </div>

                        <div class="nw-group">
                            <label class="nw-label" for="summary">
                                Mô tả ngắn
                                <span class="nw-counter" id="summaryCounter">0/500</span>
                            </label>
                            <textarea class="nw-textarea" id="summary" th:field="*{summary}" maxlength="500" rows="3"
                                      data-counter="summaryCounter"
                                      placeholder="Đoạn mô tả hiển thị trên thẻ tin tức..."></textarea>
                            <div class="nw-error" th:if="${#fields.hasErrors('summary')}" th:errors="*{summary}"></div>
                        </div>
                    </section>

                    <section class="nw-card nw-card--pad">
                        <h2 class="nw-section-title"><i class="bi bi-pencil-square"></i> Nội dung <span class="nw-required">*</span></h2>
                        <div class="nw-editor">
                            <div id="editor"></div>
                        </div>
                        <textarea id="content" th:field="*{content}" hidden></textarea>
                        <div class="nw-error" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></div>
                    </section>
                </div>

                <!-- CỘT PHẢI: XUẤT BẢN -->
                <aside class="nw-form-side">
                    <section class="nw-card nw-card--pad">
                        <h2 class="nw-section-title"><i class="bi bi-send-check"></i> Xuất bản</h2>

                        <div class="nw-group">
                            <label class="nw-label" for="branchId">Chi nhánh <span class="nw-required">*</span></label>
                            <select class="nw-select" style="width:100%" id="branchId" th:field="*{branchId}" required>
                                <option value="">-- Chọn chi nhánh --</option>
                                <option th:each="branch : ${branches}"
                                        th:value="${branch.branchId}"
                                        th:text="${branch.branchName}"></option>
                            </select>
                            <div class="nw-error" th:if="${#fields.hasErrors('branchId')}" th:errors="*{branchId}"></div>
                        </div>

                        <div class="nw-group">
                            <label class="nw-label" for="status">Trạng thái</label>
                            <select class="nw-select" style="width:100%" id="status" th:field="*{status}">
                                <option value="DRAFT">Lưu bản nháp</option>
                                <option value="PUBLISHED">Đăng bài ngay</option>
                            </select>
                        </div>

                        <div class="nw-form-actions">
                            <button type="submit" class="nw-btn nw-btn--primary">
                                <i class="bi bi-floppy"></i> Lưu bài viết
                            </button>
                            <a th:href="@{/admin/news}" class="nw-btn nw-btn--neutral">Hủy</a>
                        </div>
                    </section>

                    <section class="nw-card nw-card--pad">
                        <h2 class="nw-section-title"><i class="bi bi-image"></i> Ảnh đại diện</h2>

                        <input type="file" id="thumbnailFile" accept=".jpg,.jpeg,.png,.webp" hidden>
                        <div class="nw-upload" id="thumbnailDrop" role="button" tabindex="0"
                             aria-label="Chọn ảnh đại diện">
                            <i class="bi bi-cloud-arrow-up"></i>
                            <strong id="thumbnailDropText">Nhấn để chọn ảnh hoặc kéo thả vào đây</strong>
                            <span>JPG, PNG, WEBP</span>
                        </div>

                        <div class="nw-group" style="margin-top:14px">
                            <label class="nw-label" for="thumbnail">Đường dẫn ảnh (URL)</label>
                            <input class="nw-input" type="text" id="thumbnail" th:field="*{thumbnail}"
                                   placeholder="URL ảnh sẽ hiện ở đây..." readonly>
                        </div>

                        <div class="nw-preview" id="thumbnailPreview"
                             th:hidden="${newsCreateDTO.thumbnail == null or #strings.isEmpty(newsCreateDTO.thumbnail)}">
                            <img id="thumbnailPreviewImage" th:src="${newsCreateDTO.thumbnail}" alt="Ảnh xem trước">
                            <button type="button" id="thumbnailRemove" class="nw-btn nw-btn--danger nw-btn--sm"
                                    style="margin-top:10px; width:100%">
                                <i class="bi bi-x-lg"></i> Gỡ ảnh
                            </button>
                        </div>
                    </section>
                </aside>
            </form>

        </main>

        <footer th:replace="~{fragments/footer :: siteFooter}"></footer>
    </div>
</div>

<script src="https://cdn.ckeditor.com/ckeditor5/43.0.0/ckeditor5.umd.js"></script>
<script th:src="@{/js/news-editor.js}"></script>
</body>
</html>
