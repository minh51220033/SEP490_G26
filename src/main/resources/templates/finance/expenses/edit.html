<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: head('Chỉnh Sửa Phiếu Chi Vận Hành')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/finance.css}">
    <style>
        .exp-voucher-shell {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 4px 18px rgba(15, 23, 42, 0.04);
            padding: 24px 28px;
        }
        .exp-voucher-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            padding-bottom: 18px;
            margin-bottom: 22px;
            border-bottom: 1px solid #f1f5f9;
        }
        .exp-voucher-title {
            font-size: 18px;
            font-weight: 700;
            color: #0f172a;
            margin: 0;
            line-height: 1.3;
        }
        .exp-voucher-sub {
            font-size: 13px;
            color: #64748b;
            margin: 3px 0 0;
        }
        .exp-field-label {
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
            display: block;
        }
        .exp-control {
            border: 1px solid #dbe2ea;
            border-radius: 8px;
            font-size: 13.5px;
            color: #0f172a;
            padding: 8px 12px;
            min-height: 40px;
            transition: border-color 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
        }
        .exp-control:focus {
            border-color: #0284c7;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
            outline: none;
        }
        .exp-control:disabled,
        .exp-control[readonly] {
            background-color: #f1f5f9;
            color: #64748b;
            cursor: not-allowed;
        }
        textarea.exp-control {
            min-height: 96px;
            resize: vertical;
        }
        .exp-audit-box {
            background: #fffbeb;
            border: 1px solid #fde68a;
            border-radius: 10px;
            padding: 14px 16px;
        }
        .exp-preview-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 24px 22px;
            position: sticky;
            top: 84px;
        }
        .exp-preview-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .exp-preview-header h3 {
            font-size: 18px;
            font-weight: 700;
            color: #0f172a;
            margin: 0 0 4px;
        }
        .exp-preview-date {
            font-size: 12.5px;
            color: #64748b;
        }
        .exp-preview-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            padding: 6px 0;
            font-size: 13.5px;
        }
        .exp-preview-label {
            color: #475569;
            font-weight: 500;
            flex-shrink: 0;
        }
        .exp-preview-val {
            color: #0f172a;
            font-weight: 600;
            text-align: right;
            word-break: break-word;
        }
        .exp-preview-divider {
            border-top: 1px solid #e2e8f0;
            margin: 18px 0 16px;
        }
        .exp-signature-block {
            text-align: right;
            margin-bottom: 18px;
        }
        .exp-signature-title {
            font-size: 13.5px;
            font-weight: 700;
            color: #0f172a;
        }
        .exp-signature-hint {
            font-size: 11.5px;
            color: #64748b;
            margin-bottom: 10px;
        }
        .exp-signature-box {
            width: 120px;
            height: 54px;
            border: 1px dashed #cbd5e1;
            border-radius: 8px;
            background: #ffffff;
            margin-left: auto;
            margin-bottom: 8px;
        }
        .exp-signature-user {
            font-size: 13.5px;
            font-weight: 600;
            color: #334155;
        }
        .exp-preview-notes {
            font-size: 13px;
            color: #475569;
            border-top: 1px solid #eef2f6;
            padding-top: 12px;
        }
        .exp-preview-notes-text {
            margin-top: 4px;
            color: #334155;
            white-space: pre-wrap;
            word-break: break-word;
            min-height: 20px;
        }
        .exp-footer-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid #f1f5f9;
        }
        .exp-btn-close {
            background: #94a3b8;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 9px 20px;
            font-size: 13.5px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background-color 0.15s ease;
        }
        .exp-btn-close:hover {
            background: #64748b;
            color: #ffffff;
        }
        .exp-btn-primary {
            background: #0284c7;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 9px 24px;
            font-size: 13.5px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 6px rgba(2, 132, 199, 0.25);
            transition: background-color 0.15s ease;
        }
        .exp-btn-primary:hover {
            background: #0369a1;
            color: #ffffff;
        }
    </style>
</head>
<body class="app-body fin-brand-theme">
<div class="app-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar('expenses')}"></aside>
    <div th:replace="~{fragments/sidebar :: sidebarBackdrop}"></div>

    <div class="app-main">
        <header th:replace="~{fragments/header :: appTopbar('Chỉnh Sửa Phiếu Chi Vận Hành')}"></header>

        <main class="app-content finance-page">
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show mb-3" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="exp-voucher-shell">
                <div class="exp-voucher-head">
                    <div>
                        <h1 class="exp-voucher-title">Chỉnh sửa phiếu chi <span class="text-primary" th:text="${expense.expenseCode}">CP001</span></h1>
                        <p class="exp-voucher-sub">
                            Người tạo: <span class="fw-semibold text-dark" th:text="${expense.createdBy != null ? (expense.createdBy.username != null ? expense.createdBy.username : 'Hệ thống') : 'Hệ thống'}">Hệ thống</span>
                        </p>
                    </div>
                    <a th:href="@{/expenses}" class="btn btn-sm btn-light border text-secondary rounded-pill px-3 d-inline-flex align-items-center gap-1">
                        <i class="bi bi-arrow-left"></i><span>Danh sách phiếu chi</span>
                    </a>
                </div>

                <form id="expenseVoucherForm" th:action="@{/expenses/{id}/edit(id=${expense.expenseId})}" th:object="${expenseDTO}" method="post" novalidate>
                    <input type="hidden" id="category" th:field="*{category}">

                    <div id="expenseInlineError" class="alert alert-danger py-2 px-3 small mb-3" style="display: none;">
                        <i class="bi bi-exclamation-circle me-1"></i><span id="expenseInlineErrorText"></span>
                    </div>

                    <div class="row g-4 align-items-start">
                        <!-- Cột trái: Form cập nhật phiếu chi -->
                        <div class="col-12 col-xl-8">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label for="expenseDate" class="exp-field-label">Ngày <span class="text-danger">*</span></label>
                                    <input type="date" id="expenseDate" th:field="*{expenseDate}" class="form-control exp-control" required>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('expenseDate')}" th:errors="*{expenseDate}"></div>
                                </div>

                                <div class="col-md-6">
                                    <label for="branchId" class="exp-field-label">Chi nhánh <span class="text-danger">*</span></label>
                                    <select id="branchId" th:field="*{branchId}" class="form-select exp-control" required>
                                        <option th:each="b : ${branches}" th:value="${b.branchId}" th:text="${b.branchName}"></option>
                                    </select>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('branchId')}" th:errors="*{branchId}"></div>
                                </div>

                                <div class="col-md-6">
                                    <label for="categorySelect" class="exp-field-label">Loại chi <span class="text-danger">*</span></label>
                                    <select id="categorySelect" class="form-select exp-control">
                                        <option value="">-- Chọn loại chi phí --</option>
                                        <option th:each="c : ${categories}" th:value="${c}" th:text="${c}"></option>
                                        <option value="__CUSTOM__">Khác (Tự nhập tên loại chi...)</option>
                                    </select>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
                                </div>

                                <div class="col-md-6">
                                    <label for="customCategoryInput" class="exp-field-label">Loại chi tiết (khi chọn Khác)</label>
                                    <input type="text" id="customCategoryInput" class="form-control exp-control"
                                           placeholder="Nhập tên loại chi cụ thể..." disabled>
                                </div>

                                <div class="col-md-6">
                                    <label for="amount" class="exp-field-label">Số tiền (VNĐ) <span class="text-danger">*</span></label>
                                    <input type="text" id="amount" th:field="*{amount}" class="form-control exp-control fw-semibold"
                                           data-cashier-money="true" min="1000" required placeholder="VD: 1,000,000">
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></div>
                                </div>

                                <div class="col-md-6">
                                    <label for="paymentMethod" class="exp-field-label">Hình thức <span class="text-danger">*</span></label>
                                    <select id="paymentMethod" th:field="*{paymentMethod}" class="form-select exp-control" required>
                                        <option th:each="m : ${paymentMethods}" th:value="${m}"
                                                th:text="${m.name() == 'CASH' ? 'Tiền mặt' : (m.name() == 'BANK_TRANSFER' ? 'Chuyển khoản ngân hàng' : 'Thẻ')}"></option>
                                    </select>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('paymentMethod')}" th:errors="*{paymentMethod}"></div>
                                </div>

                                <div class="col-md-6">
                                    <label for="recipientStaffSelect" class="exp-field-label">Người nhận (Nhân viên)</label>
                                    <select id="recipientStaffSelect" class="form-select exp-control">
                                        <option value="">-- Chọn nhân viên (nếu có) --</option>
                                        <option th:each="st : ${staffOptions}"
                                                th:value="${st.fullName}"
                                                th:data-branch-ids="${st.branchIdsCsv}"
                                                th:text="${st.fullName + (st.staffCode != null ? ' (' + st.staffCode + ')' : '')}"></option>
                                    </select>
                                </div>

                                <div class="col-md-6">
                                    <label for="recipientName" class="exp-field-label">Người nhận (Khác)</label>
                                    <input type="text" id="recipientName" th:field="*{recipientName}" class="form-control exp-control"
                                           placeholder="Tên cá nhân hoặc đơn vị thụ hưởng...">
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('recipientName')}" th:errors="*{recipientName}"></div>
                                </div>

                                <div class="col-12">
                                    <label for="description" class="exp-field-label">Ghi chú <span class="text-danger">*</span></label>
                                    <textarea id="description" th:field="*{description}" class="form-control exp-control" rows="3" required
                                              placeholder="Ghi rõ lý do chi, nội dung chi phí..."></textarea>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                                </div>

                                <div class="col-12">
                                    <div class="exp-audit-box">
                                        <label for="editReason" class="exp-field-label text-danger">
                                            Lý do chỉnh sửa chi phí <span class="text-danger">* (Lưu Audit Trail)</span>
                                        </label>
                                        <input type="text" id="editReason" name="editReason" class="form-control exp-control" required
                                               placeholder="VD: Điều chỉnh hóa đơn sau đối soát, cập nhật số tiền thực chi...">
                                        <small class="text-muted d-block mt-1">Thông tin sửa đổi, người sửa và lý do sẽ được lưu vĩnh viễn trong vết kiểm toán.</small>
                                    </div>
                                </div>

                                <!-- Chữ ký xác nhận (bên trái) -->
                                <div class="col-12 d-flex justify-content-end mt-2">
                                    <div class="text-center">
                                        <div class="exp-field-label mb-1">Xác nhận</div>
                                        <th:block th:replace="~{fragments/finance-signature :: sigField('expense', ${expense.signatureUrl})}"></th:block>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Cột phải: Bản xem trước Phiếu chi -->
                        <div class="col-12 col-xl-4">
                            <aside class="exp-preview-card" aria-label="Xem trước phiếu chi">
                                <div class="exp-preview-header">
                                    <h3>Phiếu chi</h3>
                                    <div class="exp-preview-date" id="previewDate">Ngày --</div>
                                </div>

                                <div class="exp-preview-row">
                                    <span class="exp-preview-label">Mã phiếu:</span>
                                    <span class="exp-preview-val text-primary" th:text="${expense.expenseCode}">CP001</span>
                                </div>
                                <div class="exp-preview-row">
                                    <span class="exp-preview-label">Người nhận</span>
                                    <span class="exp-preview-val" id="previewRecipient">--</span>
                                </div>
                                <div class="exp-preview-row">
                                    <span class="exp-preview-label">Chi nhánh:</span>
                                    <span class="exp-preview-val" id="previewBranch">--</span>
                                </div>
                                <div class="exp-preview-row">
                                    <span class="exp-preview-label">Loại:</span>
                                    <span class="exp-preview-val" id="previewCategory">--</span>
                                </div>
                                <div class="exp-preview-row">
                                    <span class="exp-preview-label">Số tiền:</span>
                                    <span class="exp-preview-val text-primary" id="previewAmount">0 đ</span>
                                </div>
                                <div class="exp-preview-row">
                                    <span class="exp-preview-label">Hình thức:</span>
                                    <span class="exp-preview-val" id="previewMethod">--</span>
                                </div>

                                <div class="exp-preview-divider"></div>

                                <th:block th:replace="~{fragments/finance-signature :: sigMirror('expense', ${expense.signatureUrl}, 'Người lập phiếu', '(Chữ Ký, Họ Và Tên)', ${displayName != null and !displayName.isBlank() ? displayName : (loggedInUser != null ? loggedInUser.username : 'Nhân viên')})}"></th:block>

                                <div class="exp-preview-notes">
                                    <strong class="text-dark">Ghi chú:</strong>
                                    <div class="exp-preview-notes-text" id="previewDescription">--</div>
                                </div>
                            </aside>
                        </div>
                    </div>

                    <div class="exp-footer-actions">
                        <a th:href="@{/expenses}" class="exp-btn-close">Đóng</a>
                        <button type="submit" class="exp-btn-primary">
                            Cập nhật
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>

<script>
    (function () {
        const form = document.getElementById('expenseVoucherForm');
        if (!form) return;

        const dateInput = document.getElementById('expenseDate');
        const branchSelect = document.getElementById('branchId');
        const categoryHidden = document.getElementById('category');
        const categorySelect = document.getElementById('categorySelect');
        const customCategoryInput = document.getElementById('customCategoryInput');
        const amountInput = document.getElementById('amount');
        const methodSelect = document.getElementById('paymentMethod');
        const staffSelect = document.getElementById('recipientStaffSelect');
        const recipientInput = document.getElementById('recipientName');
        const descInput = document.getElementById('description');
        const editReasonInput = document.getElementById('editReason');
        const inlineErr = document.getElementById('expenseInlineError');
        const inlineErrText = document.getElementById('expenseInlineErrorText');

        const pvDate = document.getElementById('previewDate');
        const pvRecipient = document.getElementById('previewRecipient');
        const pvBranch = document.getElementById('previewBranch');
        const pvCategory = document.getElementById('previewCategory');
        const pvAmount = document.getElementById('previewAmount');
        const pvMethod = document.getElementById('previewMethod');
        const pvDesc = document.getElementById('previewDescription');

        function formatVnDate(isoDate) {
            if (!isoDate || !/^\d{4}-\d{2}-\d{2}$/.test(isoDate)) return 'Ngày --';
            const [y, m, d] = isoDate.split('-');
            return `Ngày ${d}-${m}-${y}`;
        }

        function syncCategoryFromValue(initialCat) {
            const val = (initialCat || '').trim();
            if (!val) {
                if (categorySelect.options.length > 1) {
                    categorySelect.selectedIndex = 1;
                    categoryHidden.value = categorySelect.value;
                }
                customCategoryInput.disabled = true;
                customCategoryInput.value = '';
                return;
            }
            let matched = false;
            for (const opt of categorySelect.options) {
                if (opt.value && opt.value !== '__CUSTOM__' && opt.value === val) {
                    categorySelect.value = val;
                    matched = true;
                    break;
                }
            }
            if (matched) {
                customCategoryInput.disabled = true;
                customCategoryInput.value = '';
                categoryHidden.value = val;
            } else {
                categorySelect.value = '__CUSTOM__';
                customCategoryInput.disabled = false;
                customCategoryInput.value = val;
                categoryHidden.value = val;
            }
        }

        function syncStaffOptionsForBranch() {
            if (!staffSelect || !branchSelect) return;
            const selectedBranch = branchSelect.value;
            for (const opt of staffSelect.options) {
                if (!opt.value) continue;
                const bCsv = opt.getAttribute('data-branch-ids') || '';
                const bList = bCsv ? bCsv.split(',') : [];
                const visible = !selectedBranch || bList.length === 0 || bList.includes(selectedBranch);
                opt.hidden = !visible;
            }
        }

        function syncStaffFromRecipient() {
            if (!staffSelect || !recipientInput) return;
            const nameVal = (recipientInput.value || '').trim();
            let matched = false;
            for (const opt of staffSelect.options) {
                if (opt.value && opt.value === nameVal) {
                    staffSelect.value = opt.value;
                    matched = true;
                    break;
                }
            }
            if (!matched) {
                staffSelect.value = '';
            }
        }

        function updatePreview() {
            if (pvDate) pvDate.textContent = formatVnDate(dateInput?.value);
            if (pvBranch && branchSelect) {
                const opt = branchSelect.options[branchSelect.selectedIndex];
                pvBranch.textContent = opt && opt.value ? opt.text : '--';
            }
            if (pvCategory) {
                pvCategory.textContent = (categoryHidden.value || '').trim() || '--';
            }
            if (pvAmount && amountInput) {
                const rawDisplay = (amountInput.value || '').trim();
                const parsed = typeof window.parseCashierMoney === 'function'
                    ? window.parseCashierMoney(rawDisplay)
                    : Number(rawDisplay.replace(/,/g, ''));
                if (Number.isFinite(parsed) && parsed > 0) {
                    const formatted = typeof window.formatCashierMoney === 'function'
                        ? window.formatCashierMoney(parsed, false)
                        : parsed.toLocaleString('en-US');
                    pvAmount.textContent = `${formatted} đ`;
                } else {
                    pvAmount.textContent = '0 đ';
                }
            }
            if (pvMethod && methodSelect) {
                const opt = methodSelect.options[methodSelect.selectedIndex];
                pvMethod.textContent = opt ? opt.text : '--';
            }
            if (pvRecipient) {
                pvRecipient.textContent = (recipientInput?.value || '').trim() || '--';
            }
            if (pvDesc) {
                pvDesc.textContent = (descInput?.value || '').trim() || '--';
            }
        }

        function clearInlineError() {
            if (inlineErr) inlineErr.style.display = 'none';
        }

        function showInlineError(msg) {
            if (inlineErrText) inlineErrText.textContent = msg;
            if (inlineErr) {
                inlineErr.style.display = 'block';
                inlineErr.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        if (categorySelect) {
            categorySelect.addEventListener('change', function () {
                if (this.value === '__CUSTOM__') {
                    customCategoryInput.disabled = false;
                    categoryHidden.value = (customCategoryInput.value || '').trim();
                    customCategoryInput.focus();
                } else {
                    customCategoryInput.disabled = true;
                    customCategoryInput.value = '';
                    categoryHidden.value = this.value;
                }
                clearInlineError();
                updatePreview();
            });
        }

        if (customCategoryInput) {
            customCategoryInput.addEventListener('input', function () {
                if (categorySelect.value === '__CUSTOM__') {
                    categoryHidden.value = this.value.trim();
                }
                clearInlineError();
                updatePreview();
            });
        }

        if (staffSelect) {
            staffSelect.addEventListener('change', function () {
                if (this.value) {
                    recipientInput.value = this.value;
                }
                updatePreview();
            });
        }

        if (recipientInput) {
            recipientInput.addEventListener('input', function () {
                syncStaffFromRecipient();
                updatePreview();
            });
        }

        if (branchSelect) {
            branchSelect.addEventListener('change', function () {
                syncStaffOptionsForBranch();
                updatePreview();
            });
        }

        [dateInput, amountInput, methodSelect, descInput, editReasonInput].forEach(el => {
            if (!el) return;
            el.addEventListener('input', () => { clearInlineError(); updatePreview(); });
            el.addEventListener('change', () => { clearInlineError(); updatePreview(); });
        });

        form.addEventListener('submit', function (e) {
            clearInlineError();
            if (categorySelect.value === '__CUSTOM__') {
                categoryHidden.value = (customCategoryInput.value || '').trim();
            } else {
                categoryHidden.value = (categorySelect.value || '').trim();
            }

            if (!dateInput.value) {
                e.preventDefault();
                showInlineError('Vui lòng chọn ngày phiếu chi.');
                dateInput.focus();
                return;
            }
            if (!branchSelect.value) {
                e.preventDefault();
                showInlineError('Vui lòng chọn chi nhánh.');
                branchSelect.focus();
                return;
            }
            if (!categoryHidden.value) {
                e.preventDefault();
                showInlineError('Vui lòng chọn hoặc nhập loại chi phí.');
                (categorySelect.value === '__CUSTOM__' ? customCategoryInput : categorySelect).focus();
                return;
            }
            const parsedAmt = typeof window.parseCashierMoney === 'function'
                ? window.parseCashierMoney(amountInput.value)
                : Number(String(amountInput.value || '').replace(/,/g, ''));
            if (!Number.isFinite(parsedAmt) || parsedAmt < 1000) {
                e.preventDefault();
                showInlineError('Số tiền chi phí tối thiểu là 1,000 đ.');
                amountInput.focus();
                return;
            }
            if (!descInput.value || !descInput.value.trim()) {
                e.preventDefault();
                showInlineError('Vui lòng nhập ghi chú / lý do chi.');
                descInput.focus();
                return;
            }
            if (!editReasonInput.value || !editReasonInput.value.trim()) {
                e.preventDefault();
                showInlineError('Vui lòng nhập lý do chỉnh sửa để lưu lịch sử kiểm toán.');
                editReasonInput.focus();
                return;
            }
        });

        syncCategoryFromValue(categoryHidden.value);
        syncStaffOptionsForBranch();
        syncStaffFromRecipient();
        updatePreview();
    })();
</script>
</body>
</html>
