<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Lịch hẹn tuần tháng')}"></head>
<body class="app-body"><div class="app-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar('appointments')}"></aside>
    <div th:replace="~{fragments/sidebar :: sidebarBackdrop}"></div>
    <div class="app-main"><header th:replace="~{fragments/header :: appTopbar('Lịch hẹn tuần tháng')}"></header>
        <main class="app-content"><link rel="stylesheet" th:href="@{/css/patients.css}"><link rel="stylesheet" th:href="@{/css/reception-appointments.css}">
            <div class="patient-page-heading"><div><h1>Lịch hẹn tuần / tháng</h1><p>Xem số lịch theo từng ngày; chọn ngày để về dashboard.</p></div>
                <a class="btn btn-primary" th:href="@{/reception/appointments/new}">Tạo lịch hẹn</a></div>
            <nav class="appointment-nav" aria-label="Màn hình lịch hẹn"><a th:href="@{/reception/appointments}">Dashboard</a>
                <a class="is-current" th:href="@{/reception/appointments/calendar}">Lịch tuần / tháng</a>
                <a th:href="@{/reception/appointments/no-shows}">Không đến &amp; cần nhắc</a></nav>
            <div id="pageError" class="alert alert-danger" hidden role="alert"></div>
            <section class="panel appointment-panel">
                <div class="appointment-filter"><div><label for="calendarBranch">Chi nhánh</label><select id="calendarBranch" class="form-select"></select></div>
                    <div><label for="calendarView">Kiểu xem</label><select id="calendarView" class="form-select"><option value="week">Tuần</option><option value="month">Tháng</option></select></div>
                    <div><label for="calendarDate">Ngày tham chiếu</label><input id="calendarDate" type="date" class="form-control"></div></div>
                <div class="appointment-calendar-heading"><button id="calendarPrevious" type="button" class="btn btn-outline-secondary">← Trước</button>
                    <strong id="calendarTitle"></strong><button id="calendarNext" type="button" class="btn btn-outline-secondary">Sau →</button></div>
                <div id="calendarGrid" class="appointment-calendar" aria-live="polite"></div>
            </section>
        </main>
    </div>
</div><script th:src="@{/js/reception-appointments.js}" defer></script></body></html>
