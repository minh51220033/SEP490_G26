<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Quản lý lịch hẹn')}"></head>
<body class="app-body"><div class="app-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar('appointments')}"></aside>
    <div th:replace="~{fragments/sidebar :: sidebarBackdrop}"></div>
    <div class="app-main">
        <header th:replace="~{fragments/header :: appTopbar('Quản lý lịch hẹn')}"></header>
        <main class="app-content">
            <link rel="stylesheet" th:href="@{/css/patients.css}"><link rel="stylesheet" th:href="@{/css/reception-appointments.css}">
            <div class="patient-page-heading">
                <div>
                    <h1>Quản lý lịch hẹn trong ngày</h1>
                    <p>Theo dõi, xác nhận và xử lý xung đột lịch hẹn theo ngày, chi nhánh và bác sĩ.</p>
                </div>
                <a class="btn btn-primary shadow-sm" th:href="@{/reception/appointments/new}"><i class="bi bi-plus-lg me-1"></i> Tạo lịch hẹn</a>
            </div>
            <nav class="appointment-nav" aria-label="Màn hình lịch hẹn">
                <a class="is-current" th:href="@{/reception/appointments}"><i class="bi bi-speedometer2 me-1"></i> Dashboard</a>
                <a th:href="@{/reception/appointments/calendar}"><i class="bi bi-calendar3 me-1"></i> Lịch tuần / tháng</a>
                <a th:href="@{/reception/appointments/no-shows}"><i class="bi bi-exclamation-circle me-1"></i> Không đến &amp; cần nhắc</a>
            </nav>
            <div id="pageError" class="alert alert-danger" hidden role="alert"></div>
            <section class="panel appointment-panel">
                <div class="appointment-filter">
                    <div><label for="filterDate">Ngày khám</label><input id="filterDate" type="date" class="form-control"></div>
                    <div><label for="filterBranch">Chi nhánh</label><select id="filterBranch" class="form-select"></select></div>
                    <div><label for="filterDoctor">Bác sĩ yêu cầu</label><select id="filterDoctor" class="form-select"><option value="">Tất cả bác sĩ</option></select></div>
                    <div><label for="filterType">Loại lịch hẹn</label><select id="filterType" class="form-select"><option value="ALL">Tất cả loại lịch</option><option value="LH">Lịch hẹn thường (LH)</option><option value="TK">Lịch tái khám chỉ định (TK - FT18)</option></select></div>
                </div>
                <div class="appointment-kpis" id="appointmentKpis" aria-live="polite"></div>
                <div class="table-responsive rounded-3 border">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th style="width: 150px;">Mã lịch</th>
                                <th>Bệnh nhân</th>
                                <th style="width: 120px;">Buổi khám</th>
                                <th>Bác sĩ yêu cầu</th>
                                <th style="width: 140px;">Nguồn tạo</th>
                                <th style="width: 140px;">Trạng thái</th>
                                <th class="text-end pe-3" style="width: 170px;">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="appointmentRows">
                            <tr><td colspan="7" class="text-center py-4 text-muted">Đang tải danh sách lịch hẹn…</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
</div><script th:src="@{/js/reception-appointments.js}" defer></script></body></html>
