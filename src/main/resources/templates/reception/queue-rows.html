<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><body>
<div th:fragment="rows" id="queueRows">
  <div class="queue-doctors" th:if="${!#lists.isEmpty(board.doctors)}">
    <article class="queue-doctor" th:each="d : ${board.doctors}" th:attr="data-doctor=${d.id}">
      <div class="queue-doctor-name"><span class="queue-avatar"><i class="bi bi-person-badge"></i></span><div><strong th:text="${d.name}"></strong><small th:text="|${d.waiting} đang chờ · ${d.called} đã gọi|"></small></div></div>
      <form th:action="@{/reception/queue/doctors/{id}/call-next(id=${d.id})}" method="post">
        <input type="hidden" name="branchId" th:value="${board.branchId}">
        <button class="btn btn-primary btn-sm" th:disabled="${d.waiting == 0 or d.called > 0}" type="submit"><i class="bi bi-megaphone me-1"></i>Gọi số tiếp theo</button>
      </form>
    </article>
  </div>
  <div class="queue-empty" th:if="${#lists.isEmpty(board.tickets)}"><i class="bi bi-people"></i><strong>Chưa có số khám trong ngày</strong><span>Cấp số tại bàn điều phối để bắt đầu hàng chờ.</span></div>
  <div class="queue-kanban" th:unless="${#lists.isEmpty(board.tickets)}">
    <section class="queue-lane" th:each="lane : ${lanes}">
      <div class="queue-lane-head"><h2 th:text="${lane.name() == 'WAITING' ? 'Đang chờ' : lane.name() == 'CALLED' ? 'Đã gọi' : lane.name() == 'IN_SERVICE' ? 'Đang khám' : lane.name() == 'PAUSED' ? 'Tạm dừng' : 'Hoàn tất'}"></h2><span th:text="${laneCounts.get(lane) ?: 0}"></span></div>
      <article class="queue-card" th:each="t : ${board.tickets}" th:if="${t.status == lane}" th:attr="data-doctor=${t.visit.primaryDoctor == null ? '' : t.visit.primaryDoctor.staffId}">
        <div class="queue-card-top"><strong class="queue-number" th:text="${t.displayNumber}"></strong><span class="queue-priority is-emergency" th:if="${t.isEmergency}">Cấp cứu</span><span class="queue-priority" th:if="${!t.isEmergency and t.priorityScore != null and t.priorityScore >= 50}">Ưu tiên</span><span class="badge bg-secondary ms-1" th:if="${t.visit.patientProfile.dob != null and T(java.time.Period).between(t.visit.patientProfile.dob, T(java.time.LocalDate).now()).years >= 65}">65+ tuổi</span><span class="badge bg-secondary ms-1" th:if="${t.visit.patientProfile.dob != null and T(java.time.Period).between(t.visit.patientProfile.dob, T(java.time.LocalDate).now()).years <= 6}">Trẻ nhỏ</span></div>
        <strong class="queue-patient" th:text="${t.visit.patientProfile.fullName}"></strong>
        <small class="queue-visit-code" th:text="${t.visit.visitCode}"></small>
        <small class="queue-state-note" th:if="${t.status.name() == 'PAUSED' and t.pauseReason != null}" th:text="|Tạm dừng: ${t.pauseReason}|"></small>
        <small class="queue-state-note" th:if="${t.priorityScore != null and t.priorityScore >= 50 and t.priorityReason != null}" th:text="|Lý do ưu tiên: ${t.priorityReason}|"></small>
        <div class="queue-card-info"><span><i class="bi bi-person me-1"></i><span th:text="${t.visit.primaryDoctor != null ? t.visit.primaryDoctor.fullName : 'Chưa phân bác sĩ'}"></span></span><span><i class="bi bi-geo-alt me-1"></i><span th:text="|Phòng ${t.visit.roomId ?: '—'} · Ghế ${t.visit.chairId ?: '—'}|"></span></span></div>
        <div class="queue-card-actions">
          <form th:if="${t.status.name() == 'WAITING'}" th:action="@{/reception/queue/{id}/CALL(id=${t.ticketId})}" method="post"><input type="hidden" name="branchId" th:value="${board.branchId}"><button class="btn btn-primary btn-sm" type="submit"><i class="bi bi-megaphone me-1"></i>Gọi số</button></form>
          <form th:if="${t.status.name() == 'CALLED'}" th:action="@{/reception/queue/{id}/START(id=${t.ticketId})}" method="post"><input type="hidden" name="branchId" th:value="${board.branchId}"><select th:if="${!#lists.isEmpty(board.chairs)}" name="chairId" class="form-select form-select-sm d-inline-block w-auto me-1" title="Đổi ghế nếu ghế dự kiến bị chiếm"><option th:each="c : ${board.chairs}" th:if="${c.status.name() == 'AVAILABLE' and (t.visit.roomId == null or c.room == null or c.room.roomId == t.visit.roomId)}" th:value="${c.chairId}" th:selected="${c.chairId == t.visit.chairId}" th:text="|${c.chairName}${c.chairId == t.visit.chairId ? ' (dự kiến)' : ''}|"></option></select><button class="btn btn-success btn-sm" type="submit" th:disabled="${t.visit.roomId == null or t.visit.chairId == null}">Bắt đầu khám</button></form>
          <a class="btn btn-outline-primary btn-sm" th:if="${t.status.name() == 'CALLED' and (t.visit.roomId == null or t.visit.chairId == null)}" th:href="@{/reception/dispatch(branchId=${board.branchId})}">Phân phòng / ghế</a>
          <form th:if="${t.status.name() == 'PAUSED'}" th:action="@{/reception/queue/{id}/RESUME(id=${t.ticketId})}" method="post"><input type="hidden" name="branchId" th:value="${board.branchId}"><button class="btn btn-outline-primary btn-sm" type="submit">Tiếp tục chờ</button></form>
          <form th:if="${t.status.name() == 'IN_SERVICE'}" th:action="@{/reception/queue/{id}/DONE(id=${t.ticketId})}" method="post"><input type="hidden" name="branchId" th:value="${board.branchId}"><button class="btn btn-outline-success btn-sm" type="submit">Hoàn tất số</button></form>
        </div>
        <details class="queue-more" th:if="${t.status.name() == 'WAITING'}"><summary>Gọi vượt thứ tự</summary>
          <form th:action="@{/reception/queue/{id}/CALL(id=${t.ticketId})}" method="post"><input type="hidden" name="branchId" th:value="${board.branchId}"><label th:for="|skip-${t.ticketId}|">Lý do gọi vượt thứ tự</label><input class="form-control form-control-sm" th:id="|skip-${t.ticketId}|" name="reason" minlength="10" maxlength="255" required placeholder="Ví dụ: Bác sĩ yêu cầu gọi trước ca này"><button class="btn btn-outline-warning btn-sm" type="submit">Xác nhận gọi vượt</button></form>
        </details>
        <details class="queue-more" th:if="${t.status.name() == 'WAITING' or t.status.name() == 'CALLED'}"><summary>Tạm dừng số</summary>
          <form th:action="@{/reception/queue/{id}/PAUSE(id=${t.ticketId})}" method="post"><input type="hidden" name="branchId" th:value="${board.branchId}"><label th:for="|pause-${t.ticketId}|">Lý do tạm dừng</label><input class="form-control form-control-sm" th:id="|pause-${t.ticketId}|" name="reason" minlength="10" maxlength="255" required placeholder="Ví dụ: Bệnh nhân tạm ra ngoài"><button class="btn btn-outline-secondary btn-sm" type="submit">Xác nhận tạm dừng</button></form>
        </details>
        <details class="queue-more" th:if="${(t.status.name() == 'WAITING' or t.status.name() == 'PAUSED') and !t.isEmergency and (t.priorityScore == null or t.priorityScore < 50)}"><summary>Ưu tiên người già / trẻ em</summary>
          <form th:action="@{/reception/queue/{id}/PRIORITIZE(id=${t.ticketId})}" method="post"><input type="hidden" name="branchId" th:value="${board.branchId}"><label th:for="|priority-${t.ticketId}|">Lý do ưu tiên</label><input class="form-control form-control-sm" th:id="|priority-${t.ticketId}|" name="reason" minlength="10" maxlength="255" required placeholder="Ví dụ: Bệnh nhân cao tuổi cần hỗ trợ"><button class="btn btn-outline-warning btn-sm" type="submit">Áp dụng ưu tiên</button></form>
        </details>
        <details class="queue-more is-emergency" th:if="${(t.status.name() == 'WAITING' or t.status.name() == 'PAUSED') and !t.isEmergency}"><summary>Chuyển cấp cứu</summary>
          <form th:action="@{/reception/queue/{id}/EMERGENCY(id=${t.ticketId})}" method="post"><input type="hidden" name="branchId" th:value="${board.branchId}"><label th:for="|emergency-${t.ticketId}|">Lý do cấp cứu</label><input class="form-control form-control-sm" th:id="|emergency-${t.ticketId}|" name="reason" minlength="10" maxlength="255" required placeholder="Ví dụ: Chảy máu nhiều, cần xử lý ngay"><button class="btn btn-danger btn-sm" type="submit">Xác nhận cấp cứu</button></form>
        </details>
      </article>
    </section>
  </div>
</div>
</body></html>
