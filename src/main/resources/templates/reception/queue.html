<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Hàng chờ khám')}"></head>
<body class="app-body">
<div class="app-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar('queue')}"></aside>
    <div th:replace="~{fragments/sidebar :: sidebarBackdrop}"></div>
    <div class="app-main">
        <header th:replace="~{fragments/header :: appTopbar('Hàng chờ khám')}"></header>
        <main id="reception-content-area" class="app-content queue-page">
            <link rel="stylesheet" th:href="@{/css/reception-queue.css}">

            <!-- Thanh dẫn hướng quy trình tiếp đón thống nhất -->
            <nav class="card border-0 shadow-sm rounded-4 mb-3 p-2 bg-white" data-reception-stepper aria-label="Quy trình tiếp đón">
                <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 px-2 py-1">
                    <div class="d-flex align-items-center gap-2 small">
                        <span class="badge bg-primary-subtle text-primary fw-bold px-2.5 py-1.5"><i class="bi bi-diagram-3 me-1"></i>QUY TRÌNH TIẾP ĐÓN</span>
                        <span class="text-muted d-none d-lg-inline">Chuỗi nghiệp vụ lễ tân &amp; điều phối khám:</span>
                    </div>
                    <div class="d-flex flex-wrap align-items-center gap-2 small">
                        <a th:href="@{/reception/appointments}" class="btn btn-sm btn-outline-secondary rounded-pill px-2.5 py-0.5 text-decoration-none" title="Bước 1: Quản lý lịch hẹn">
                            <span class="badge bg-secondary rounded-circle me-1">1</span> Lịch hẹn
                        </a>
                        <i class="bi bi-chevron-right text-muted opacity-50" style="font-size: 11px;"></i>
                        <a th:href="@{/reception/check-in}" class="btn btn-sm btn-outline-success rounded-pill px-2.5 py-0.5 text-decoration-none fw-semibold" title="Bước 2: Tiếp đón &amp; Check-in">
                            <span class="badge bg-success text-white rounded-circle me-1">2</span> Tiếp đón &amp; Check-in
                        </a>
                        <i class="bi bi-chevron-right text-muted opacity-50" style="font-size: 11px;"></i>
                        <a th:href="@{/reception/dispatch(branchId=${board.branchId})}" class="btn btn-sm btn-outline-primary rounded-pill px-2.5 py-0.5 text-decoration-none fw-semibold" title="Bước 3: Điều phối ghế &amp; gán bác sĩ">
                            <span class="badge bg-primary text-white rounded-circle me-1">3</span> Điều phối ghế nha
                        </a>
                        <i class="bi bi-chevron-right text-muted opacity-50" style="font-size: 11px;"></i>
                        <span class="btn btn-sm btn-primary rounded-pill px-3 py-0.5 fw-bold shadow-sm" title="Bước 4: Đang ở màn hình này">
                            <span class="badge bg-white text-primary rounded-circle me-1">4</span> Hàng chờ gọi số
                        </span>
                    </div>
                    <div>
                        <div th:replace="~{fragments/header :: branchSelectInline}"></div>
                    </div>
                </div>
            </nav>

            <div class="alert alert-success alert-dismissible fade show border-0 shadow-sm rounded-3 mb-3" role="status" th:if="${notice}">
                <div class="d-flex align-items-center gap-2">
                    <i class="bi bi-check-circle-fill text-success fs-5"></i>
                    <span th:text="${notice}"></span>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div class="alert alert-danger alert-dismissible fade show border-0 shadow-sm rounded-3 mb-3" role="alert" th:if="${error}">
                <div class="d-flex align-items-center gap-2">
                    <i class="bi bi-exclamation-triangle-fill text-danger fs-5"></i>
                    <span th:text="${error}"></span>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Toolbar: Branch selection & Doctor filter -->
            <div class="queue-toolbar">
                <form method="get" th:action="@{/reception/queue}" class="queue-branch-form">
                    <label for="branchId">Chi nhánh đang phục vụ</label>
                    <div class="input-group">
                        <select id="branchId" name="branchId" class="form-select">
                            <option th:each="b : ${board.branches}" th:value="${b.branchId}" th:selected="${b.branchId == board.branchId}" th:text="${b.branchName}"></option>
                        </select>
                        <button class="btn btn-primary" type="submit"><i class="bi bi-arrow-repeat me-1"></i>Áp dụng</button>
                    </div>
                </form>
                <div class="queue-toolbar-actions">
                    <div>
                        <label for="doctorFilter">Lọc theo bác sĩ</label>
                        <select id="doctorFilter" class="form-select">
                            <option value="">Tất cả bác sĩ</option>
                            <option th:each="d : ${board.doctors}" th:value="${d.id}" th:text="${d.name}"></option>
                        </select>
                    </div>
                    <a class="btn btn-outline-secondary" th:href="@{/reception/queue/tv/{id}(id=${board.branchId})}" target="_blank" rel="noopener">
                        <i class="bi bi-display me-1"></i>Màn hình Tivi sảnh
                    </a>
                </div>
            </div>

            <!-- Dynamic Kanban Board replaced via real-time polling -->
            <div id="queueRows" th:replace="~{reception/queue-rows :: rows}"></div>

        </main>
    </div>
</div>

<!-- Modal Quick Action (Tạm dừng / Cấp cứu / Ưu tiên / Gọi vượt) -->
<div class="modal fade" id="queueActionModal" tabindex="-1" aria-labelledby="queueActionModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow rounded-4">
            <form id="queueActionForm" method="post" action="">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <input type="hidden" name="branchId" th:value="${board.branchId}">

                <div class="modal-header bg-light border-0 py-3 px-4 rounded-top-4">
                    <div>
                        <h5 class="modal-title fw-bold text-dark" id="queueActionModalLabel">
                            <i class="bi bi-gear-fill text-primary me-1.5"></i> Thao tác số khám
                        </h5>
                        <small class="text-muted" id="queueActionModalSubtitle">Chọn lý do hoặc ghi chú cho thao tác này.</small>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body p-4">
                    <!-- Ticket Summary Badge -->
                    <div class="p-3 bg-light rounded-3 mb-3 border d-flex align-items-center justify-content-between">
                        <div>
                            <strong id="modalActionPatientName" class="fs-6 text-dark d-block">Nguyễn Văn A</strong>
                            <small class="text-muted" id="modalActionVisitCode">Mã khám: V12345</small>
                        </div>
                        <span id="modalActionTicketNumber" class="badge bg-primary text-white font-monospace fs-5 px-3 py-1">01</span>
                    </div>

                    <!-- Preset Reasons -->
                    <label class="form-label small fw-bold text-dark mb-2">Lý do thường dùng (nhấn chọn nhanh):</label>
                    <div class="d-flex flex-column gap-2 mb-3" id="queuePresetOptions">
                        <!-- Populated dynamically by JS -->
                    </div>

                    <!-- Custom Reason Textarea -->
                    <div class="mb-2">
                        <label for="queueActionReasonInput" class="form-label small fw-bold text-dark mb-1">
                            Nội dung chi tiết (10 - 255 ký tự) *
                        </label>
                        <textarea id="queueActionReasonInput" name="reason" class="form-control" rows="2" minlength="10" maxlength="255" required placeholder="Ghi nhận lý do cụ thể..."></textarea>
                    </div>
                </div>

                <div class="modal-footer bg-light border-0 py-2.5 px-4 rounded-bottom-4">
                    <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Đóng</button>
                    <button type="submit" id="modalActionSubmitBtn" class="btn btn-primary btn-sm fw-bold px-3">
                        <i class="bi bi-check2-circle me-1"></i> Xác nhận
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script id="queueConfig" type="application/json" th:text="${board.branchId}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
<script th:src="@{/js/reception-queue.js}" defer></script>
<script th:src="@{/js/reception-workflow-navigation.js}" defer></script>
</body>
</html>
