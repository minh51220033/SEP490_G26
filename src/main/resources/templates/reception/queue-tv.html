<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Màn hình Gọi số - Hàng chờ khám</title>
  <link rel="stylesheet" th:href="@{/css/reception-queue-tv.css}">
</head>
<body th:attr="data-branch=${branchId}">
<main>
  <header>
    <div>
      <span>THÔNG TIN HÀNG CHỜ PHÒNG KHÁM</span>
      <h1 id="branch" th:text="${board.branch}">Cơ sở Quận 1</h1>
    </div>
    <div style="display: flex; align-items: center; gap: 16px;">
      <button id="soundToggle" class="tv-sound-btn" type="button" title="Bật/Tắt âm thanh đọc số" aria-pressed="false">
        <span id="soundIcon">🔈</span> <span id="soundText">Bật âm thanh</span>
      </button>
      <div class="live-indicator"><i></i>Trực tiếp</div>
    </div>
  </header>
  <div class="tv-grid">
    <section class="tv-panel tv-main">
      <div class="tv-panel-title">ĐANG GỌI VÀO KHÁM</div>
      <div id="called" class="called-list">
        <div class="tv-empty">Chưa có số được gọi</div>
      </div>
    </section>
    <section class="tv-panel tv-side">
      <div class="tv-panel-title">ĐANG CHỜ</div>
      <strong id="waiting" class="waiting-count" th:text="${board.waiting}">0</strong>
      <div class="tv-panel-title next-title">SỐ TIẾP THEO</div>
      <div id="next" class="next-list" aria-live="polite">—</div>
    </section>
    <section class="tv-panel tv-serving">
      <div class="tv-panel-title">ĐANG KHÁM TẠI GHẾ</div>
      <div id="serving" class="serving-list">—</div>
    </section>
  </div>
</main>
<script th:src="@{/js/reception-queue-tv.js}" defer></script>
</body>
</html>
