<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Màn hình Gọi số | CV-DCMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #ffffff;
      color: #0f172a;
      font-family: 'Be Vietnam Pro', 'Inter', sans-serif;
      padding: 24px 32px;
      min-height: 100vh;
    }
    .tv-basic-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 16px;
      margin-bottom: 20px;
      border-bottom: 1px solid #e2e8f0;
    }
    .tv-basic-title {
      font-size: 22px;
      font-weight: 700;
      color: #0f172a;
    }
    .tv-basic-subtitle {
      font-size: 13.5px;
      color: #64748b;
      margin-top: 4px;
    }
    .tv-basic-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .tv-basic-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 14px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #0f172a;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .tv-basic-btn:hover {
      background: #f8fafc;
    }
    .tv-basic-table-wrap {
      width: 100%;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      overflow: hidden;
      background: #ffffff;
    }
    table.tv-basic-table {
      width: 100%;
      border-collapse: collapse;
      background: #ffffff;
    }
    table.tv-basic-table thead th {
      background: #f8fafc;
      color: #334155;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      padding: 13px 16px;
      border-bottom: 1px solid #e2e8f0;
      text-align: center;
    }
    table.tv-basic-table tbody td {
      padding: 14px 16px;
      border-bottom: 1px solid #f1f5f9;
      font-size: 15px;
      color: #0f172a;
      text-align: center;
      vertical-align: middle;
    }
    table.tv-basic-table tbody tr:last-child td {
      border-bottom: none;
    }
    table.tv-basic-table tbody tr.is-called-row {
      background: #f0f9ff;
      font-weight: 600;
    }
    .tv-ticket-pill {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 6px;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      font-family: monospace;
      font-size: 16px;
      font-weight: 700;
      color: #0284c7;
    }
    .tv-code-pill {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 6px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      font-family: monospace;
      font-size: 13.5px;
      font-weight: 600;
      color: #334155;
    }
    .tv-empty-row {
      padding: 36px 16px !important;
      color: #64748b !important;
      font-size: 14px !important;
    }
  </style>
</head>
<body th:attr="data-branch=${branchId}">
<div class="tv-basic-container">

  <header class="tv-basic-header">
    <div>
      <h1 class="tv-basic-title">Danh sách Hàng chờ Gọi số - <span id="branch" th:text="${board.branch}">Cơ sở Quận 1</span></h1>
      <div class="tv-basic-subtitle">
        Đang chờ khám: <strong id="waiting" th:text="${board.waiting}">0</strong> bệnh nhân
      </div>
    </div>

    <div class="tv-basic-actions">
      <button id="soundToggle" class="tv-basic-btn" type="button" title="Bật hoặc tắt âm thanh đọc số" aria-pressed="false">
        <span id="soundIcon">🔈</span>
        <span id="soundText">Bật âm thanh</span>
      </button>
    </div>
  </header>

  <main class="tv-basic-table-wrap">
    <table class="tv-basic-table" id="tvBasicListTable">
      <thead>
        <tr>
          <th style="width: 110px;">Số thứ tự</th>
          <th style="width: 160px;">Số phiếu</th>
          <th style="width: 190px;">Mã bệnh nhân</th>
          <th>Tên bệnh nhân</th>
          <th style="width: 200px;">Số điện thoại</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="row : ${queueList}"
            th:classappend="${row.status == 'CALLED'} ? 'is-called-row' : ''">
          <td th:text="${row.orderIndex}">1</td>
          <td>
            <span class="tv-ticket-pill" th:text="${row.ticketNumber}">01</span>
          </td>
          <td>
            <span class="tv-code-pill" th:text="${row.patientCode}">BN001</span>
          </td>
          <td class="fw-semibold" th:text="${row.patientName}">Nguyễn Văn A</td>
          <td th:text="${row.phoneNumber}">0901234567</td>
        </tr>
        <tr th:if="${#lists.isEmpty(queueList)}">
          <td colspan="5" class="tv-empty-row">Chưa có bệnh nhân trong danh sách gọi số.</td>
        </tr>
      </tbody>
    </table>
  </main>

  <!-- Hidden containers for live audio announcement script compatibility -->
  <div class="d-none" style="display:none;" aria-hidden="true">
    <div id="called"></div>
    <div id="serving"></div>
    <div id="next"></div>
  </div>

</div>

<script th:src="@{/js/reception-queue-tv.js}" defer></script>
</body>
</html>
