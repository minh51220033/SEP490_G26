# Run this profile only after the existing database has been bootstrapped and
# every historical manual migration in database/migrations has been reconciled.
# Flyway applies V100+; Hibernate validates and never changes schema in release.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.defer-datasource-initialization=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.sql.init.mode=never
server.error.include-stacktrace=never
server.error.include-message=never
