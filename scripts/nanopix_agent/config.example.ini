# CẤU HÌNH ĐỒNG BỘ ẢNH NANOPIX CHO MÁY TRẠM PHÒNG KHÁM CV-DCMS
# Cài đặt và chạy trên máy tính Windows cắm sensor NanoPix1 (USB)

[SERVER]
# Địa chỉ máy chủ CV-DCMS (Production khuyến nghị dùng HTTPS, ví dụ: https://clinic.example.com/api/xray/ingest)
api_url = http://localhost:8080/api/xray/ingest
health_url = http://localhost:8080/api/xray/stats
# API Key bảo mật máy trạm (Hoặc đặt qua biến môi trường NANOPIX_API_KEY trên Windows).
# Không dùng secret thật trong file example này.
api_key = CHANGE_ME_NANOPIX_AGENT_SECRET

[NANOPIX]
# QUAN TRỌNG: Đường dẫn thư mục lưu ảnh thực tế của phần mềm Eighteeth NanoPix trên máy này
# Kiểm tra trong Settings -> Storage Path của phần mềm NanoPix hoặc thư mục xuất ảnh thực tế.
# Quy ước đặt tên file/thư mục khi chụp để tự động gắn 100% vào đúng phiếu chỉ định:
#   Cách 1 (Khuyến nghị): Nhập Mã chụp trên phiếu chỉ định (VD: XQ812345) vào trường Patient ID hoặc tên file xuất.
#   Cách 2: Nhập Mã bệnh nhân (VD: BN000123) kèm số răng (VD: R36) -> BN000123_R36_NguyenVanA.jpg
watch_folder = C:/Eighteeth/NanoPix/Export

# Định dạng ảnh cần theo dõi
file_extensions = .jpg,.jpeg,.png,.bmp,.dcm

# Thông tin phần cứng cảm biến (in trên thân sensor)
device_serial = EN1E0408A032
device_model = NanoPix1 (Eighteeth / Sifary)
branch_id = 1

[SYNC_OPTIONS]
# Thời gian chờ sau khi phát hiện file mới để đảm bảo Eighteeth đã ghi xong file (giây)
file_write_settle_seconds = 2.0
# Số lần kiểm tra kích thước file ổn định
file_stability_checks = 3
# Khoảng thời gian thử lại khi mất mạng (giây)
retry_interval_seconds = 30
# Thư mục cơ sở dữ liệu lưu vết cục bộ chống gửi trùng
local_db_path = ./nanopix_agent_state.db
